name: "Temporary · Format test tsconfig"

on:
  push:
    branches:
      - refactor/shared-release-identity

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Show exact Prettier diff
        run: |
          npx --yes prettier@3.9.9 tsconfig.tests.json --write
          git diff -- tsconfig.tests.json
