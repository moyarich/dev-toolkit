name: Reusable - update package lockfile

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package location
        required: true
        default: packages/workspace-tools
        type: choice
        options:
          - packages/demo-tools
          - packages/readme-screenshots
          - packages/web-components
          - packages/workspace-tools
      commit:
        description: Commit package-lock.json changes
        required: true
        default: true
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "22"
        type: string
  workflow_call:
    inputs:
      package-directory:
        description: Package location under packages/
        required: true
        type: string
      commit:
        description: Commit package-lock.json changes
        required: false
        default: false
        type: boolean
      node-version:
        required: false
        default: "22"
        type: string
    secrets:
      package-token:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Validate package directory
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          case "$PACKAGE_DIRECTORY" in
            packages/*) ;;
            *) echo "Package location must be under packages/: $PACKAGE_DIRECTORY"; exit 1 ;;
          esac
          test -f "$PACKAGE_DIRECTORY/package.json"

      - name: Generate package lockfile
        working-directory: ${{ inputs.package-directory }}
        run: npm install --package-lock-only --workspaces=false
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}

      - name: Verify package lockfile
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: test -f "$PACKAGE_DIRECTORY/package-lock.json"

      - name: Commit package lockfile
        if: ${{ inputs.commit }}
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          git add "$PACKAGE_DIRECTORY/package-lock.json"
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(packages): update package lockfile"
          git push origin "HEAD:$GITHUB_REF_NAME"
