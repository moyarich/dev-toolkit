name: External recovery contract
# Validate merged reusable recovery and semantic-version fixes without mutations
on:
  pull_request:
    paths:
      - .github/workflows/external-recovery-contract.yml
permissions: {}
jobs:
  reset-preview:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_reset-release.yml@v0
    with:
      package: .github/recovery-contract-fixture
      target-branch: test/external-recovery-only
      dry-run: true


  # Test named restore-source CLI inputs and recovery guards from a separate repository.
  restore-preview:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_restore-release.yml@v0
    with:
      package: .github/recovery-contract-fixture
      target-branch: test/external-recovery-only
      restore-source: commit:017bed0276ba7186f7236e013bd368a418183bdb
      dry-run: true
