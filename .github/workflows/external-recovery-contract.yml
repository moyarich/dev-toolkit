name: External recovery contract
on:
  pull_request:
    paths:
      - .github/workflows/external-recovery-contract.yml
permissions: {}
jobs:
  reset-preview:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_reset-release.yml@fix/recovery-external-call
    with:
      package: "."
      target-branch: main
      dry-run: true
