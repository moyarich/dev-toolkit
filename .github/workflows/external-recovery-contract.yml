name: External recovery contract
# Validate release recovery through an unpublished fixture without mutations
on:
  pull_request:
    paths:
      - .github/workflows/external-recovery-contract.yml
permissions: {}
jobs:
  reset-preview:
    permissions:
      actions: read
      contents: write
      packages: read
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_reset-release.yml@main
    with:
      package: .github/recovery-contract-fixture
      target-branch: test/external-recovery-only
      dry-run: true

