name: Draft package releases

run-name: >-
  Draft package releases · ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package selector (all, package name, or packages/<directory>)
        required: true
        default: all
        type: string

      version:
        description: Optional explicit release version (for first release, use 0.1.0)
        required: false
        default: ""
        type: string

  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  discover-packages:
    name: "Discover publishable packages"
    uses: moyarich/actions/.github/workflows/reusable_discover-packages.yml@d430b304d667341f76cadaba64bfdbb23d3685d2
    with:
      packages-directory: packages
      require-publish-config: true
      node-version: "24"

  select-packages:
    name: "Select packages for drafting"
    needs: discover-packages
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      has-packages: ${{ steps.select.outputs.has-packages }}
      count: ${{ steps.select.outputs.count }}

    steps:
      - name: Checkout repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Select affected packages
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          PACKAGES_JSON: ${{ needs.discover-packages.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$INPUT_PACKAGE" = "all" ]; then
              SELECTED="$PACKAGES_JSON"
            else
              SELECTED="$(
                jq -c --arg selector "$INPUT_PACKAGE" '
                  [
                    .[] |
                    select(.name == $selector or .directory == $selector)
                  ]
                ' <<< "$PACKAGES_JSON"
              )"
            fi
          else
            if [ -n "$BEFORE_SHA" ] &&
               [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              CHANGED_FILES="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            else
              CHANGED_FILES="$(git diff-tree --root --no-commit-id --name-only -r "$AFTER_SHA")"
            fi

            SELECTED="$(
              PACKAGES_JSON="$PACKAGES_JSON" CHANGED_FILES="$CHANGED_FILES" node --input-type=module <<'NODE'
          const packages = JSON.parse(process.env.PACKAGES_JSON || "[]");
          const files = (process.env.CHANGED_FILES || "")
            .split("\n")
            .map((file) => file.trim())
            .filter(Boolean);

          const selected = packages.filter((pkg) =>
            files.some(
              (file) =>
                file === pkg.directory || file.startsWith(`${pkg.directory}/`),
            ),
          );

          process.stdout.write(JSON.stringify(selected));
          NODE
            )"
          fi

          COUNT="$(jq 'length' <<< "$SELECTED")"
          MATRIX="$(jq -cn --argjson packages "$SELECTED" '{include: $packages}')"

          {
            echo "matrix=$MATRIX"
            echo "count=$COUNT"
            if [ "$COUNT" -gt 0 ]; then
              echo "has-packages=true"
            else
              echo "has-packages=false"
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "# Draft package selection"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Trigger | `%s` |\n' "$EVENT_NAME"
            echo "| Selected packages | **$COUNT** |"
            echo
            if [ "$EVENT_NAME" = "push" ]; then
              echo "> Root and shared-tooling changes do not implicitly draft every package."
              echo "> Only changed files under a publishable package directory select that package."
              echo
            fi
            echo '~~~json'
            jq . <<< "$SELECTED"
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  validate-selection:
    name: "Validate package selector"
    needs: discover-packages
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          PACKAGES_JSON: ${{ needs.discover-packages.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$INPUT_PACKAGE" = "all" ]; then
            exit 0
          fi

          if jq -e --arg selector "$INPUT_PACKAGE" '
            any(.[]; .name == $selector or .directory == $selector)
          ' <<< "$PACKAGES_JSON" >/dev/null; then
            exit 0
          fi

          echo "::error::Unknown package selector: $INPUT_PACKAGE"
          echo "Available selectors:"
          jq -r '.[] | "  - \(.name)  [\(.directory)]"' <<< "$PACKAGES_JSON"
          exit 1

  draft-release:
    name: "package: ${{ matrix.name }} | dir: ${{ matrix.directory }}"
    needs:
      - discover-packages
      - select-packages
      - validate-selection
    if: >-
      ${{ needs.discover-packages.result == 'success' &&
          needs.select-packages.result == 'success' &&
          needs.select-packages.outputs.has-packages == 'true' &&
          (github.event_name != 'workflow_dispatch' ||
           needs.validate-selection.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-packages.outputs.matrix || '{"include":[]}') }}

    concurrency:
      group: draft-package-${{ github.repository }}-${{ matrix.directory }}
      cancel-in-progress: true

    steps:
      - name: Decide whether package is selected
        id: selected
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ] ||
             [ "$INPUT_PACKAGE" = "all" ] ||
             [ "$INPUT_PACKAGE" = "$PACKAGE_NAME" ] ||
             [ "$INPUT_PACKAGE" = "$PACKAGE_DIRECTORY" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main history
        if: ${{ steps.selected.outputs.value == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        if: ${{ steps.selected.outputs.value == 'true' }}
        uses: actions/setup-node@v7 # v7
        with:
          node-version: "24"

      - name: Generate package Release Drafter config
        if: ${{ steps.selected.outputs.value == 'true' }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail

          node --experimental-strip-types --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          import { releaseIdentity } from "./packages/workspace-tools/src/release-identity.ts";

          const template = readFileSync(
            ".github/release-drafter-package-template.yml",
            "utf8",
          );

          const identity = releaseIdentity(
            {
              directory: process.env.PACKAGE_DIRECTORY,
              manifest: {
                name: process.env.PACKAGE_NAME,
                version: "$RESOLVED_VERSION",
              },
            },
            "$RESOLVED_VERSION",
          );

          const config = template
            .replaceAll("{{PACKAGE_NAME}}", identity.packageName)
            .replaceAll("{{PACKAGE_DIRECTORY}}", identity.packageDirectory)
            .replaceAll("{{RELEASE_NAME_TEMPLATE}}", identity.releaseName)
            .replaceAll("{{TAG_TEMPLATE}}", identity.tagName)
            .replaceAll("{{TAG_PREFIX}}", identity.tagPrefix);

          writeFileSync(
            ".github/release-drafter-package-generated.yml",
            config,
          );
          NODE

      - name: Resolve package release baseline
        id: baseline
        if: ${{ steps.selected.outputs.value == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASES="$(
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100"
          )"

          PREVIOUS_TAG="$(
            jq -r --arg prefix "$PACKAGE_DIRECTORY@" '
              [
                .[][] |
                select(
                  .draft == false and
                  (.tag_name | startswith($prefix))
                )
              ]
              | sort_by(.published_at // .created_at)
              | last
              | .tag_name // empty
            ' <<< "$RELEASES"
          )"

          VERSION="$INPUT_VERSION"
          EXISTING_DRAFT_ID=""
          EXISTING_DRAFT_URL=""
          EXISTING_DRAFT_NAME=""

          EXISTING_GIT_TAG="$(
            git tag --list "$PACKAGE_DIRECTORY@*" |
              sort -V |
              tail -n 1
          )"

          # A newer package tag with a matching draft is an intentional
          # release-in-progress state. Only a tag with neither a published
          # release nor a matching draft is considered orphaned.
          if [ -n "$EXISTING_GIT_TAG" ] && [ "$EXISTING_GIT_TAG" != "$PREVIOUS_TAG" ]; then
            EXISTING_DRAFT="$(
              jq -c --arg tag "$EXISTING_GIT_TAG" '
                [
                  .[][] |
                  select(.draft == true and .tag_name == $tag)
                ]
                | first // empty
              ' <<< "$RELEASES"
            )"

            if [ -n "$EXISTING_DRAFT" ]; then
              EXISTING_DRAFT_ID="$(jq -r '.id' <<< "$EXISTING_DRAFT")"
              EXISTING_DRAFT_URL="$(jq -r '.html_url' <<< "$EXISTING_DRAFT")"
              EXISTING_DRAFT_NAME="$(jq -r '.name' <<< "$EXISTING_DRAFT")"
              VERSION="${EXISTING_GIT_TAG#"$PACKAGE_DIRECTORY@"}"
              SOURCE="existing tagged draft release"
            else
              WOULD_VERSION="${VERSION:-${EXISTING_GIT_TAG#"$PACKAGE_DIRECTORY@"}}"
              IDENTITY="$(
                PACKAGE_NAME="$PACKAGE_NAME" \
                PACKAGE_DIRECTORY="$PACKAGE_DIRECTORY" \
                VERSION="$WOULD_VERSION" \
                node --experimental-strip-types --input-type=module <<'NODE'
          import { releaseIdentity } from "./packages/workspace-tools/src/release-identity.ts";

          process.stdout.write(
            JSON.stringify(
              releaseIdentity(
                {
                  directory: process.env.PACKAGE_DIRECTORY,
                  manifest: {
                    name: process.env.PACKAGE_NAME,
                    version: process.env.VERSION,
                  },
                },
                process.env.VERSION,
              ),
            ),
          );
          NODE
              )"
              WOULD_TAG="$(jq -r '.tagName' <<< "$IDENTITY")"
              WOULD_NAME="$(jq -r '.releaseName' <<< "$IDENTITY")"

              WOULD_CHANGES="$(
                git log \
                  --reverse \
                  --format='- %s (%h)' \
                  HEAD \
                  -- "$PACKAGE_DIRECTORY" |
                  sed '/^- $/d'
              )"

              if [ -z "$WOULD_CHANGES" ]; then
                WOULD_CHANGES="- No package-specific commits found."
              fi

              WOULD_BODY="$(
                {
                  echo "## What's Changed"
                  echo
                  echo "$WOULD_CHANGES"
                }
              )"

              {
                echo "# Package release draft"
                echo
                echo "## Release blocked"
                echo
                echo "A package Git tag exists without a matching draft or published GitHub Release."
                echo
                echo "| Would-have-created | Value |"
                echo "| --- | --- |"
                echo "| Package | \`$PACKAGE_NAME\` |"
                echo "| Directory | \`$PACKAGE_DIRECTORY\` |"
                echo "| Version | \`$WOULD_VERSION\` |"
                echo "| Tag | \`$WOULD_TAG\` |"
                echo "| Release name | \`$WOULD_NAME\` |"
                echo "| Existing Git tag | \`$EXISTING_GIT_TAG\` |"
                echo "| Result | **Blocked — release history requires reconciliation** |"
                echo
                echo "## Would-have-created release content"
                echo
                echo "$WOULD_BODY"
                echo
              } >> "$GITHUB_STEP_SUMMARY"

              echo "::error::Found orphan package Git tag '$EXISTING_GIT_TAG'."
              echo "::error::Expected a matching draft or published GitHub Release before continuing."
              exit 1
            fi
          elif [ -n "$PREVIOUS_TAG" ]; then
            SOURCE="previous published package release"
          else
            SOURCE="full package Git history"

            if [ -z "$VERSION" ]; then
              VERSION="0.1.0"
            fi
          fi

          {
            echo "source=$SOURCE"
            echo "version=$VERSION"
            echo "previous-tag=$PREVIOUS_TAG"
            echo "existing-git-tag=$EXISTING_GIT_TAG"
            echo "existing-draft-id=$EXISTING_DRAFT_ID"
            echo "existing-draft-url=$EXISTING_DRAFT_URL"
            echo "existing-draft-name=$EXISTING_DRAFT_NAME"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize workflow summary
        if: ${{ steps.selected.outputs.value == 'true' }}
        shell: bash
        run: |
          {
            echo "# Package release draft"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Directory | \`${{ matrix.directory }}\` |"
            echo "| Current package version | \`${{ matrix.version }}\` |"
            echo "| Release version | \`${{ steps.baseline.outputs.version || 'auto' }}\` |"
            echo "| Previous published tag | \`${{ steps.baseline.outputs.previous-tag || 'none' }}\` |"
            echo "| Existing Git tag | \`${{ steps.baseline.outputs.existing-git-tag || 'none' }}\` |"
            echo "| Baseline source | \`${{ steps.baseline.outputs.source }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update first package draft
        id: first-draft
        if: ${{ steps.selected.outputs.value == 'true' && steps.baseline.outputs.previous-tag == '' && steps.baseline.outputs.existing-draft-id == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
          VERSION: ${{ steps.baseline.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY="$(
            PACKAGE_NAME="$PACKAGE_NAME" \
            PACKAGE_DIRECTORY="$PACKAGE_DIRECTORY" \
            VERSION="$VERSION" \
            node --experimental-strip-types --input-type=module <<'NODE'
          import { releaseIdentity } from "./packages/workspace-tools/src/release-identity.ts";

          process.stdout.write(
            JSON.stringify(
              releaseIdentity(
                {
                  directory: process.env.PACKAGE_DIRECTORY,
                  manifest: {
                    name: process.env.PACKAGE_NAME,
                    version: process.env.VERSION,
                  },
                },
                process.env.VERSION,
              ),
            ),
          );
          NODE
          )"
          TAG="$(jq -r '.tagName' <<< "$IDENTITY")"
          NAME="$(jq -r '.releaseName' <<< "$IDENTITY")"

          CHANGELOG_PATH="$PACKAGE_DIRECTORY/CHANGELOG.md"

          if [ -f "$CHANGELOG_PATH" ]; then
            NOTES="$(
              CHANGELOG_PATH="$CHANGELOG_PATH" VERSION="$VERSION" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const lines = readFileSync(process.env.CHANGELOG_PATH, "utf8").split("\n");
          const heading = `## ${process.env.VERSION}`;
          const notes = [];
          let collecting = false;

          for (const line of lines) {
            if (line.trim() === heading) {
              collecting = true;
              continue;
            }

            if (collecting && /^##\s+/.test(line)) {
              break;
            }

            if (collecting) {
              notes.push(line);
            }
          }

          process.stdout.write(notes.join("\n").trim());
          NODE
            )"
          else
            NOTES=""
          fi

          NOTE_SOURCE="changelog"

          if [ -z "$NOTES" ]; then
            NOTE_SOURCE="merged-prs"
            PR_ROWS=""

            while IFS= read -r COMMIT_SHA; do
              [ -n "$COMMIT_SHA" ] || continue

              ASSOCIATED_PRS="$(
                gh api "repos/$GH_REPO/commits/$COMMIT_SHA/pulls" 2>/dev/null || printf '[]'
              )"

              ROWS="$(
                jq -r '
                  .[] |
                  select(.merged_at != null and .base.ref == "main") |
                  [.number, .title, .user.login] |
                  @tsv
                ' <<< "$ASSOCIATED_PRS"
              )"

              if [ -n "$ROWS" ]; then
                PR_ROWS="${PR_ROWS}${PR_ROWS:+$'\n'}$ROWS"
              fi
            done < <(
              git log --reverse --format='%H' HEAD -- "$PACKAGE_DIRECTORY"
            )

            NOTES="$(
              PR_ROWS="$PR_ROWS" node --input-type=module <<'NODE'
          const rows = (process.env.PR_ROWS || "")
            .split("\n")
            .map((line) => line.trim())
            .filter(Boolean);

          const seen = new Set();
          const items = [];

          for (const row of rows) {
            const [number, title, author] = row.split("\t", 3);

            if (!number || !title || seen.has(number)) {
              continue;
            }

            seen.add(number);
            items.push(
              `- ${title} (#${number})${author ? ` @${author}` : ""}`,
            );
          }

          process.stdout.write(items.join("\n"));
          NODE
            )"
          fi

          if [ -z "$NOTES" ]; then
            NOTE_SOURCE="commits"
            COMMITS="$(
              git log \
                --reverse \
                --format='%s%x09%h' \
                HEAD \
                -- "$PACKAGE_DIRECTORY"
            )"

            NOTES="$(
              COMMITS="$COMMITS" node --input-type=module <<'NODE'
          const rows = (process.env.COMMITS || "")
            .split("\n")
            .map((line) => line.trim())
            .filter(Boolean);

          const groups = new Map([
            ["Features", []],
            ["Fixes", []],
            ["Documentation", []],
            ["Maintenance", []],
          ]);

          const seen = new Set();

          for (const row of rows) {
            const [subject, hash = ""] = row.split("\t", 2);

            if (!subject || /^release(?:\([^)]*\))?:/i.test(subject)) {
              continue;
            }

            const match = subject.match(
              /^(feat|fix|docs|refactor|perf|build|ci|chore|test|style)(?:\([^)]*\))?!?:\s*(.+)$/i,
            );

            const type = match?.[1]?.toLowerCase() || "chore";
            const summary = (match?.[2] || subject)
              .replace(/\s*\(#\d+\)$/, "")
              .trim();

            const key = summary.toLowerCase();

            if (!summary || seen.has(key)) {
              continue;
            }

            seen.add(key);

            const item = hash ? `- ${summary} (${hash})` : `- ${summary}`;

            if (type === "feat") {
              groups.get("Features").push(item);
            } else if (type === "fix") {
              groups.get("Fixes").push(item);
            } else if (type === "docs") {
              groups.get("Documentation").push(item);
            } else {
              groups.get("Maintenance").push(item);
            }
          }

          const sections = [];

          for (const [title, items] of groups) {
            if (items.length) {
              sections.push(`### ${title}\n\n${items.join("\n")}`);
            }
          }

          process.stdout.write(sections.join("\n\n"));
          NODE
            )"
          fi

          if [ -z "$NOTES" ]; then
            NOTE_SOURCE="minimal"
            NOTES="Initial release of $PACKAGE_NAME."
          fi

          echo "Release notes source: $NOTE_SOURCE"

          BODY="$(
            {
              echo "<!-- dev-toolkit-release-draft:candidate package=$PACKAGE_NAME -->"
              echo
              echo "## Release notes"
              echo
              echo "$NOTES"
              echo
              echo "## Install"
              echo
              echo '~~~sh'
              echo "npm install $PACKAGE_NAME@$VERSION --registry=https://npm.pkg.github.com"
              echo '~~~'
            }
          )"

          EXISTING_ID="$(
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
              jq -r --arg tag "$TAG" '
                [.[][] | select(.draft == true and .tag_name == $tag)]
                | first
                | .id // empty
              '
          )"

          if [ -n "$EXISTING_ID" ]; then
            RELEASE="$(
              gh api \
                --method PATCH \
                "repos/$GH_REPO/releases/$EXISTING_ID" \
                -f tag_name="$TAG" \
                -f target_commitish="main" \
                -f name="$NAME" \
                -f body="$BODY" \
                -F draft=true
            )"
          else
            RELEASE="$(
              gh api \
                --method POST \
                "repos/$GH_REPO/releases" \
                -f tag_name="$TAG" \
                -f target_commitish="main" \
                -f name="$NAME" \
                -f body="$BODY" \
                -F draft=true
            )"
          fi

          {
            echo "name=$(jq -r '.name' <<< "$RELEASE")"
            echo "tag_name=$(jq -r '.tag_name' <<< "$RELEASE")"
            echo "html_url=$(jq -r '.html_url' <<< "$RELEASE")"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update subsequent package draft
        id: drafter
        if: ${{ steps.selected.outputs.value == 'true' && steps.baseline.outputs.previous-tag != '' && steps.baseline.outputs.existing-draft-id == '' }}
        uses: release-drafter/release-drafter@v7.7.0
        with:
          config-name: file:release-drafter-package-generated.yml
          commitish: main
          version: ${{ steps.baseline.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Draft summary
        if: ${{ steps.selected.outputs.value == 'true' }}
        shell: bash
        run: |
          {
            echo "## Draft prepared"
            echo
            echo "| Release | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Name | \`${{ steps.baseline.outputs.existing-draft-name || steps.first-draft.outputs.name || steps.drafter.outputs.name }}\` |"
            echo "| Tag | \`${{ steps.baseline.outputs.existing-git-tag || steps.first-draft.outputs.tag_name || steps.drafter.outputs.tag_name }}\` |"
            echo "| Draft | [Open package draft release](${{ steps.baseline.outputs.existing-draft-url || steps.first-draft.outputs.html_url || steps.drafter.outputs.html_url }}) |"

            if [ -n "${{ steps.baseline.outputs.existing-draft-id }}" ]; then
              echo
              echo "> Existing tagged draft detected. The draft was left unchanged for the release workflow to finalize."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
