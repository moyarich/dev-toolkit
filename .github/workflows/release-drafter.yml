name: Draft package releases

run-name: >-
  Draft package releases · ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package selector (all, package name, or packages/<directory>)
        required: true
        default: all
        type: string

      version:
        description: Optional explicit release version (for first release, use 0.1.0)
        required: false
        default: ""
        type: string

  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  discover-packages:
    name: "Discover publishable packages"
    uses: ./.github/workflows/reusable_discover-packages.yml
    with:
      packages-directory: packages
      require-publish-config: true
      node-version: "24"

  validate-selection:
    name: "Validate package selector"
    needs: discover-packages
    runs-on: ubuntu-latest
    steps:
      - name: Validate selected package
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          PACKAGES_JSON: ${{ needs.discover-packages.outputs.packages }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$INPUT_PACKAGE" = "all" ]; then
            exit 0
          fi

          if jq -e --arg selector "$INPUT_PACKAGE" '
            any(.[]; .name == $selector or .directory == $selector)
          ' <<< "$PACKAGES_JSON" >/dev/null; then
            exit 0
          fi

          echo "::error::Unknown package selector: $INPUT_PACKAGE"
          echo "Available selectors:"
          jq -r '.[] | "  - \(.name)  [\(.directory)]"' <<< "$PACKAGES_JSON"
          exit 1

  draft-release:
    name: "package: ${{ matrix.name }} | dir: ${{ matrix.directory }}"
    needs:
      - discover-packages
      - validate-selection
    if: >-
      ${{ needs.discover-packages.result == 'success' &&
          needs.discover-packages.outputs.has-packages == 'true' &&
          (github.event_name != 'workflow_dispatch' ||
           needs.validate-selection.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-packages.outputs.matrix || '{"include":[]}') }}

    steps:
      - name: Decide whether package is selected
        id: selected
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PACKAGE: ${{ inputs.package }}
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "workflow_dispatch" ] ||
             [ "$INPUT_PACKAGE" = "all" ] ||
             [ "$INPUT_PACKAGE" = "$PACKAGE_NAME" ] ||
             [ "$INPUT_PACKAGE" = "$PACKAGE_DIRECTORY" ]; then
            echo "value=true" >> "$GITHUB_OUTPUT"
          else
            echo "value=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout main history
        if: ${{ steps.selected.outputs.value == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Generate package Release Drafter config
        if: ${{ steps.selected.outputs.value == 'true' }}
        env:
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";

          const template = readFileSync(
            ".github/release-drafter-package-template.yml",
            "utf8",
          );

          const config = template
            .replaceAll("{{PACKAGE_NAME}}", process.env.PACKAGE_NAME)
            .replaceAll("{{PACKAGE_DIRECTORY}}", process.env.PACKAGE_DIRECTORY);

          writeFileSync(
            ".github/release-drafter-package-generated.yml",
            config,
          );
          NODE

      - name: Resolve package release baseline
        id: baseline
        if: ${{ steps.selected.outputs.value == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_VERSION: ${{ inputs.version }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASES="$(
            gh api               --paginate               --slurp               "repos/$GH_REPO/releases?per_page=100"
          )"

          PREVIOUS_TAG="$(
            jq -r --arg prefix "$PACKAGE_DIRECTORY@" '
              [
                .[][] |
                select(
                  .draft == false and
                  (.tag_name | startswith($prefix))
                )
              ]
              | sort_by(.published_at // .created_at)
              | last
              | .tag_name // empty
            ' <<< "$RELEASES"
          )"

          VERSION="$INPUT_VERSION"

          EXISTING_GIT_TAG="$(
            git tag --list "$PACKAGE_DIRECTORY@*" |
              sort -V |
              tail -n 1
          )"

          if [ -n "$PREVIOUS_TAG" ]; then
            SOURCE="previous published package release"
          elif [ -n "$EXISTING_GIT_TAG" ]; then
            WOULD_VERSION="${VERSION:-0.1.0}"
            WOULD_TAG="$PACKAGE_DIRECTORY@$WOULD_VERSION"
            WOULD_NAME="$PACKAGE_NAME v$WOULD_VERSION"

            WOULD_CHANGES="$(
              git log \
                --reverse \
                --format='- %s (%h)' \
                HEAD \
                -- "$PACKAGE_DIRECTORY" |
                sed '/^- $/d'
            )"

            if [ -z "$WOULD_CHANGES" ]; then
              WOULD_CHANGES="- No package-specific commits found."
            fi

            WOULD_BODY="$(
              {
                echo "## What's Changed"
                echo
                echo "$WOULD_CHANGES"
              }
            )"

            {
              echo "# Package release draft"
              echo
              echo "## Release blocked"
              echo
              echo "A package Git tag exists without a matching published GitHub Release, so the workflow did not create or update a draft."
              echo
              echo "| Would-have-created | Value |"
              echo "| --- | --- |"
              echo "| Package | \`$PACKAGE_NAME\` |"
              echo "| Directory | \`$PACKAGE_DIRECTORY\` |"
              echo "| Version | \`$WOULD_VERSION\` |"
              echo "| Tag | \`$WOULD_TAG\` |"
              echo "| Release name | \`$WOULD_NAME\` |"
              echo "| Existing Git tag | \`$EXISTING_GIT_TAG\` |"
              echo "| Result | **Blocked — release history requires reconciliation** |"
              echo
              echo "## Would-have-created release content"
              echo
              echo "$WOULD_BODY"
              echo
            } >> "$GITHUB_STEP_SUMMARY"

            echo "::error::Found Git tag '$EXISTING_GIT_TAG' for $PACKAGE_DIRECTORY but no matching published GitHub Release."
            echo "::error::Refusing to treat this package as a first release. Publish/restore the release or supply an explicit version after reconciling release history."
            exit 1
          else
            SOURCE="full package Git history"

            if [ -z "$VERSION" ]; then
              VERSION="0.1.0"
            fi
          fi

          {
            echo "source=$SOURCE"
            echo "version=$VERSION"
            echo "previous-tag=$PREVIOUS_TAG"
            echo "existing-git-tag=$EXISTING_GIT_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize workflow summary
        if: ${{ steps.selected.outputs.value == 'true' }}
        shell: bash
        run: |
          {
            echo "# Package release draft"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Directory | \`${{ matrix.directory }}\` |"
            echo "| Current package version | \`${{ matrix.version }}\` |"
            echo "| Release version | \`${{ steps.baseline.outputs.version || 'auto' }}\` |"
            echo "| Previous published tag | \`${{ steps.baseline.outputs.previous-tag || 'none' }}\` |"
            echo "| Existing Git tag | \`${{ steps.baseline.outputs.existing-git-tag || 'none' }}\` |"
            echo "| Baseline source | \`${{ steps.baseline.outputs.source }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update first package draft
        id: first-draft
        if: ${{ steps.selected.outputs.value == 'true' && steps.baseline.outputs.previous-tag == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_NAME: ${{ matrix.name }}
          PACKAGE_DIRECTORY: ${{ matrix.directory }}
          VERSION: ${{ steps.baseline.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          TAG="$PACKAGE_DIRECTORY@$VERSION"
          NAME="$PACKAGE_NAME v$VERSION"

          CHANGELOG_PATH="$PACKAGE_DIRECTORY/CHANGELOG.md"

          if [ -f "$CHANGELOG_PATH" ]; then
            NOTES="$(
              awk -v version="$VERSION" '
                $0 == "## " version {
                  found = 1
                  next
                }

                found && /^## / {
                  exit
                }

                found {
                  print
                }
              ' "$CHANGELOG_PATH" |
                sed -e '/./,$!d' -e :a -e '/^\\n*$/{$d;N;ba' -e '}'
            )"
          else
            NOTES=""
          fi

          if [ -z "$NOTES" ]; then
            COMMITS="$(
              git log \
                --reverse \
                --format='%s%x09%h' \
                HEAD \
                -- "$PACKAGE_DIRECTORY"
            )"

            NOTES="$(
              COMMITS="$COMMITS" node --input-type=module <<'NODE'
          const rows = (process.env.COMMITS || "")
            .split("\n")
            .map((line) => line.trim())
            .filter(Boolean);

          const groups = new Map([
            ["Features", []],
            ["Fixes", []],
            ["Documentation", []],
            ["Maintenance", []],
          ]);

          const seen = new Set();

          for (const row of rows) {
            const [subject, hash = ""] = row.split("\t", 2);

            if (!subject || /^release(?:\\([^)]*\\))?:/i.test(subject)) {
              continue;
            }

            const match = subject.match(
              /^(feat|fix|docs|refactor|perf|build|ci|chore|test|style)(?:\\([^)]*\\))?!?:\\s*(.+)$/i,
            );

            const type = match?.[1]?.toLowerCase() || "chore";
            const summary = (match?.[2] || subject)
              .replace(/\\s*\\(#\\d+\\)$/, "")
              .trim();

            const key = summary.toLowerCase();

            if (!summary || seen.has(key)) {
              continue;
            }

            seen.add(key);

            const item = hash ? `- ${summary} (${hash})` : `- ${summary}`;

            if (type === "feat") {
              groups.get("Features").push(item);
            } else if (type === "fix") {
              groups.get("Fixes").push(item);
            } else if (type === "docs") {
              groups.get("Documentation").push(item);
            } else {
              groups.get("Maintenance").push(item);
            }
          }

          const sections = [];

          for (const [title, items] of groups) {
            if (items.length) {
              sections.push(`### ${title}\n\n${items.join("\n")}`);
            }
          }

          process.stdout.write(
            sections.join("\n\n") || "- No package-specific changes found.",
          );
          NODE
            )"
          fi

          BODY="$(
            {
              echo "## Release notes"
              echo
              echo "$NOTES"
              echo
              echo "## Install"
              echo
              echo '~~~sh'
              echo "npm install $PACKAGE_NAME@$VERSION --registry=https://npm.pkg.github.com"
              echo '~~~'
            }
          )"

          EXISTING_ID="$(
            gh api --paginate --slurp "repos/$GH_REPO/releases?per_page=100" |
              jq -r --arg tag "$TAG" '
                [.[][] | select(.draft == true and .tag_name == $tag)]
                | first
                | .id // empty
              '
          )"

          if [ -n "$EXISTING_ID" ]; then
            RELEASE="$(
              gh api \
                --method PATCH \
                "repos/$GH_REPO/releases/$EXISTING_ID" \
                -f tag_name="$TAG" \
                -f target_commitish="main" \
                -f name="$NAME" \
                -f body="$BODY" \
                -F draft=true
            )"
          else
            RELEASE="$(
              gh api \
                --method POST \
                "repos/$GH_REPO/releases" \
                -f tag_name="$TAG" \
                -f target_commitish="main" \
                -f name="$NAME" \
                -f body="$BODY" \
                -F draft=true
            )"
          fi

          {
            echo "name=$(jq -r '.name' <<< "$RELEASE")"
            echo "tag_name=$(jq -r '.tag_name' <<< "$RELEASE")"
            echo "html_url=$(jq -r '.html_url' <<< "$RELEASE")"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update subsequent package draft
        id: drafter
        if: ${{ steps.selected.outputs.value == 'true' && steps.baseline.outputs.previous-tag != '' }}
        uses: release-drafter/release-drafter@v7.7.0
        with:
          config-name: file:release-drafter-package-generated.yml
          commitish: main
          version: ${{ steps.baseline.outputs.version }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Draft summary
        if: ${{ steps.selected.outputs.value == 'true' }}
        shell: bash
        run: |
          {
            echo "## Draft prepared"
            echo
            echo "| Release | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Name | \`${{ steps.first-draft.outputs.name || steps.drafter.outputs.name }}\` |"
            echo "| Tag | \`${{ steps.first-draft.outputs.tag_name || steps.drafter.outputs.tag_name }}\` |"
            echo "| Draft | [Open package draft release](${{ steps.first-draft.outputs.html_url || steps.drafter.outputs.html_url }}) |"
          } >> "$GITHUB_STEP_SUMMARY"
