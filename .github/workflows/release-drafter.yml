name: Draft package releases

run-name: >-
  Draft package releases · ${{ github.event_name == 'workflow_dispatch' && inputs.package || 'all' }}

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package draft to refresh
        required: true
        default: all
        type: choice
        options:
          - all
          - demo-tools
          - readme-screenshots
          - vite-plugin-package-bin
          - vs-code-ext-tools
          - web-components
          - workspace-tools

      version:
        description: Optional explicit release version (for first release, use 0.1.0)
        required: false
        default: ""
        type: string

      from:
        description: Optional comparison baseline ref; empty + explicit version uses the first commit on main
        required: false
        default: ""
        type: string

  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  draft-release:
    name: "package: ${{ matrix.name }} | dir: packages/${{ matrix.directory }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - directory: demo-tools
            name: "@moyarich/demo-tools"
            config: release-drafter-demo-tools.yml
          - directory: readme-screenshots
            name: "@moyarich/readme-screenshots"
            config: release-drafter-readme-screenshots.yml
          - directory: vite-plugin-package-bin
            name: "@moyarich/vite-plugin-package-bin"
            config: release-drafter-vite-plugin-package-bin.yml
          - directory: vs-code-ext-tools
            name: "@moyarich/vs-code-ext-tools"
            config: release-drafter-vs-code-ext-tools.yml
          - directory: web-components
            name: "@moyarich/web-components"
            config: release-drafter-web-components.yml
          - directory: workspace-tools
            name: "@moyarich/workspace-tools"
            config: release-drafter-workspace-tools.yml

    steps:
      - name: Checkout main history
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              (inputs.package == 'all' || inputs.package == matrix.directory) }}
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve comparison baseline
        id: baseline
        if: >-
          ${{ github.event_name == 'workflow_dispatch' &&
              (inputs.package == 'all' || inputs.package == matrix.directory) }}
        env:
          INPUT_FROM: ${{ inputs.from }}
          INPUT_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -n "$INPUT_FROM" ]; then
            BASELINE="$INPUT_FROM"
            SOURCE="input"
          elif [ -n "$INPUT_VERSION" ]; then
            BASELINE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
            SOURCE="first commit on main"
          else
            BASELINE=""
            SOURCE="previous published package release"
          fi

          {
            echo "from=$BASELINE"
            echo "source=$SOURCE"
          } >> "$GITHUB_OUTPUT"

      - name: Initialize workflow summary
        if: >-
          ${{ github.event_name != 'workflow_dispatch' ||
              inputs.package == 'all' ||
              inputs.package == matrix.directory }}
        shell: bash
        run: |
          {
            echo "# Package release draft"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Directory | \`packages/${{ matrix.directory }}\` |"
            echo "| Config | \`${{ matrix.config }}\` |"
            echo "| Requested version | \`${{ inputs.version || 'auto' }}\` |"
            echo "| Comparison baseline | \`${{ steps.baseline.outputs.from || 'previous published package release' }}\` |"
            echo "| Baseline source | \`${{ steps.baseline.outputs.source || 'automatic' }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Trigger | \`${{ github.event_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update package draft release
        id: drafter
        if: >-
          ${{ github.event_name != 'workflow_dispatch' ||
              inputs.package == 'all' ||
              inputs.package == matrix.directory }}
        uses: release-drafter/release-drafter@v7.7.0
        with:
          config-name: ${{ matrix.config }}
          commitish: main
          version: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
          from: ${{ github.event_name == 'workflow_dispatch' && steps.baseline.outputs.from || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Draft summary
        if: >-
          ${{ github.event_name != 'workflow_dispatch' ||
              inputs.package == 'all' ||
              inputs.package == matrix.directory }}
        shell: bash
        run: |
          {
            echo "## Draft prepared"
            echo
            echo "| Release | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Name | \`${{ steps.drafter.outputs.name }}\` |"
            echo "| Tag | \`${{ steps.drafter.outputs.tag_name }}\` |"
            echo "| Draft | [Open package draft release](${{ steps.drafter.outputs.html_url }}) |"
          } >> "$GITHUB_STEP_SUMMARY"

  approve-release:
    name: Approve reviewed package drafts
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: draft-release
    runs-on: ubuntu-latest
    environment:
      name: release

    steps:
      - name: Record approval
        shell: bash
        run: |
          {
            echo "# Package release drafts approved"
            echo
            echo "The selected package draft release workflow passed the \`release\` environment approval gate."
            echo
            echo "> This workflow does not publish GitHub Releases or npm packages."
            echo "> Existing package release and publish workflows remain responsible for irreversible release operations."
          } >> "$GITHUB_STEP_SUMMARY"
