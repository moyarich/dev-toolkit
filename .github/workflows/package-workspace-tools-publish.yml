name: Package . Workspace Tools . Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version; empty uses package.json
        required: false
        default: ""
        type: string
      registry:
        description: Package registry
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
      tag:
        description: Distribution tag
        required: true
        default: latest
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ./.github/workflows/reusable_npm-publish.yml
    with:
      package-directory: packages/workspace-tools
      version: ${{ inputs.version }}
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
    secrets:
      github-token: ${{ secrets._GITHUB_TOKEN }}
      npm-token: ${{ secrets._NPM_TOKEN }}
