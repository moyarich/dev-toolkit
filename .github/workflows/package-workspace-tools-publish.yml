name: Package . Workspace Tools . Publish

run-name: >-
  Workspace Tools Publish · ${{ inputs.registry }} · ${{ inputs.tag }} ·
  dry-run=${{ inputs.dry-run }}

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Publish — preview without publishing
        required: true
        default: true
        type: boolean

      version:
        description: Version — exact version to verify; empty uses package.json
        required: false
        default: ""
        type: string

      registry:
        description: Publish — package registry
        required: true
        default: github
        type: choice
        options:
          - github
          - npm

      tag:
        description: Publish — distribution tag
        required: true
        default: latest
        type: string

      verify-git-tag:
        description: Safety — require the matching package release Git tag
        required: true
        default: true
        type: boolean

      node-version:
        description: Advanced — Node.js version
        required: true
        default: "24"
        type: string

concurrency:
  group: workspace-tools-package-mutation
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish-approval:
    name: "job: Publish approval"
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Record approval
        shell: bash
        run: |
          {
            echo "# Publish approved"
            echo
            echo "A real package publish was approved through the `release` environment."
            echo
            echo "| Environment | `release` |"
            echo "| Protection | Configure required reviewers/rules in **Settings → Environments → release** |"
            echo
            echo "> Dry runs do not require this approval."
            echo "> If the `release` environment did not already exist, GitHub may create it without protection rules; configure the environment before relying on it as an approval gate."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: "package: @moyarich/workspace-tools | dir: packages/workspace-tools"
    needs: publish-approval
    if: ${{ always() && (inputs.dry-run || needs.publish-approval.result == 'success') }}
    uses: ./.github/workflows/reusable_npm-publish.yml
    with:
      package-directory: packages/workspace-tools
      dry-run: ${{ inputs.dry-run }}
      version: ${{ inputs.version }}
      registry: ${{ inputs.registry }}
      tag: ${{ inputs.tag }}
      verify-git-tag: ${{ inputs.verify-git-tag }}
      node-version: ${{ inputs.node-version }}
    secrets:
      github-token: ${{ secrets._GITHUB_TOKEN }}
      npm-token: ${{ secrets._NPM_TOKEN }}
