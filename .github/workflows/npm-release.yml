name: Reusable package release

on:
  workflow_call:
    inputs:
      package-directory:
        description: Package location under packages/
        required: true
        type: string
      release-mode:
        description: bump, exact, or current
        required: false
        default: bump
        type: string
      release-bump:
        description: SemVer bump when release-mode is bump
        required: false
        default: patch
        type: string
      exact-version:
        description: Exact SemVer when release-mode is exact
        required: false
        default: ""
        type: string
      dry-run:
        description: Preview the release without changing, tagging, pushing, or publishing
        required: false
        default: true
        type: boolean
      auto-publish:
        description: Publish the released version after pushing the release
        required: false
        default: false
        type: boolean
      registry:
        description: github, npm, or both
        required: false
        default: github
        type: string
      tag:
        description: npm distribution tag
        required: false
        default: latest
        type: string
      node-version:
        required: false
        default: "24"
        type: string
    secrets:
      github-token:
        required: false
      npm-token:
        required: false

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}

      - name: Resolve package
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          case "$PACKAGE_DIRECTORY" in
            packages/*) ;;
            *)
              echo "Package location must be under packages/: $PACKAGE_DIRECTORY"
              exit 1
              ;;
          esac

          test -f "$PACKAGE_DIRECTORY/package.json"
          PACKAGE_KEY="${PACKAGE_DIRECTORY#packages/}"

          case "$PACKAGE_KEY" in
            ""|*/*|*[!A-Za-z0-9._-]*)
              echo "Invalid package directory: $PACKAGE_DIRECTORY"
              exit 1
              ;;
          esac

          echo "PACKAGE_KEY=$PACKAGE_KEY" >> "$GITHUB_ENV"

      - name: Install dependencies
        working-directory: ${{ inputs.package-directory }}
        run: npm install --include=optional

      - name: Configure release author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        env:
          RELEASE_MODE: ${{ inputs.release-mode }}
          RELEASE_BUMP: ${{ inputs.release-bump }}
          EXACT_VERSION: ${{ inputs.exact-version }}
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
        run: |
          case "$RELEASE_MODE" in
            bump) RELEASE_VALUE="$RELEASE_BUMP" ;;
            exact) test -n "$EXACT_VERSION" || { echo "exact-version is required for exact mode"; exit 1; }; RELEASE_VALUE="$EXACT_VERSION" ;;
            current) RELEASE_VALUE="$(node -p "require('./$PACKAGE_DIRECTORY/package.json').version")" ;;
            *) echo "release-mode must be bump, exact, or current"; exit 1 ;;
          esac
          echo "RELEASE_VALUE=$RELEASE_VALUE" >> "$GITHUB_ENV"

      - name: Release or preview package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.github-token || github.token }}
          DRY_RUN: ${{ inputs.dry-run }}
        run: |
          DRY_RUN_FLAG=""
          if [ "$DRY_RUN" = "true" ]; then DRY_RUN_FLAG="--dry-run"; fi
          if [ -f packages/workspace-tools/bin/workspace-release.mjs ]; then
            node packages/workspace-tools/bin/workspace-release.mjs "$PACKAGE_KEY=$RELEASE_VALUE" --mode="${{ inputs.release-mode }}" --version="$RELEASE_VALUE" $DRY_RUN_FLAG
          else
            npx --yes @moyarich/workspace-tools workspace-release "$PACKAGE_KEY=$RELEASE_VALUE" --mode="${{ inputs.release-mode }}" --version="$RELEASE_VALUE" $DRY_RUN_FLAG
          fi

      - name: Push release commit and tag
        if: ${{ !inputs.dry-run }}
        run: git push origin "HEAD:$GITHUB_REF_NAME" --follow-tags

      - name: Ensure staged publishing CLI support
        if: ${{ !inputs.dry-run && inputs.auto-publish && inputs.registry != 'github' }}
        run: npm install --global npm@">=11.15.0 <12"

      - name: Publish released version
        if: ${{ !inputs.dry-run && inputs.auto-publish }}
        env:
          _GITHUB_TOKEN: ${{ secrets.github-token }}
          _NPM_TOKEN: ${{ secrets.npm-token }}
        run: |
          if [ -f packages/workspace-tools/bin/workspace-publish.mjs ]; then
            node packages/workspace-tools/bin/workspace-publish.mjs "$PACKAGE_KEY" --registry="${{ inputs.registry }}" --tag="${{ inputs.tag }}"
          else
            npx --yes @moyarich/workspace-tools workspace-publish "$PACKAGE_KEY" --registry="${{ inputs.registry }}" --tag="${{ inputs.tag }}"
          fi
