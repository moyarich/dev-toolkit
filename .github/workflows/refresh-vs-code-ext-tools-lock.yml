name: Refresh vs-code-ext-tools lockfile

on:
  push:
    branches:
      - feat/vs-code-ext-tools-test-cache
    paths:
      - .github/workflows/refresh-vs-code-ext-tools-lock.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/vs-code-ext-tools-test-cache

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Refresh package-lock.json
        run: npm install --package-lock-only

      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: refresh package lock"
          git push
