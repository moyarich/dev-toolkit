name: Temporary format VS Code test cleaner

on:
  push:
    branches:
      - feat/vscode-test-cleaner
    paths:
      - .github/workflows/tmp-format-vscode-test-cleaner.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Format package files
        run: |
          npx --yes prettier@3.9.9 --write             packages/vscode-test-cleaner/CHANGELOG.md             packages/vscode-test-cleaner/src/cli/vscode-test-clean.ts             packages/vscode-test-cleaner/src/index.ts             packages/vscode-test-cleaner/tests/index.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/vscode-test-cleaner/CHANGELOG.md                   packages/vscode-test-cleaner/src/cli/vscode-test-clean.ts                   packages/vscode-test-cleaner/src/index.ts                   packages/vscode-test-cleaner/tests/index.test.ts
          git commit -m "style(vscode-test-cleaner): format package files"
          git push origin "HEAD:feat/vscode-test-cleaner"
