name: "Package . CI"

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package selector (all, package name, or packages/<directory>)
        required: true
        default: all
        type: string

      node-version:
        description: Node.js version used by CI
        required: true
        default: "24"
        type: string

  pull_request:
  # Format every branch when commits are uploaded. Existing pull requests
  # receive the repair automatically because their head branch is updated.
  push:

permissions:
  contents: read
  packages: read

jobs:
  # Pushes are writable and self-healing. Pull requests are verification-only;
  # they never receive workflow-authored commits.
  format:
    name: "Format pushed branch"
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: write
    uses: ./.github/workflows/reusable_format.yml
    with:
      commit: true
      node-version: ${{ inputs.node-version || '24' }}

  root-checks:
    name: "Root checks"
    needs: format
    if: ${{ always() && (needs.format.result == 'success' || needs.format.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.package-directory == 'all') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install workspace dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Install shell test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Install Chromium for Storybook tests
        run: npx playwright install --with-deps chromium

      - name: Run root checks
        run: npm run checks

      - name: Checks summary
        if: ${{ always() }}
        run: |
          {
            echo "## Root checks"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Command | `%s` |\n' 'npm run checks'
            printf '| Node.js | `%s` |\n' "${{ inputs.node-version || '24' }}"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  package-ci:
    name: "Package CI"
    needs: format
    if: ${{ always() && (needs.format.result == 'success' || needs.format.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.package-directory == 'all') }}
    uses: ./.github/workflows/reusable_package-ci.yml
    with:
      packages-directory: packages
      node-version: ${{ inputs.node-version || '24' }}

  auto-glow-ci:
    name: "Auto Glow CI"
    needs: format
    if: ${{ always() && (needs.format.result == 'success' || needs.format.result == 'skipped') && (github.event_name != 'workflow_dispatch' || inputs.package-directory == 'all' || inputs.package-directory == 'packages/moyarich-auto-glow-md' || inputs.package-directory == '@moyarich/auto-glow-md') }}
    uses: ./.github/workflows/reusable_auto-glow-ci.yml
    with:
      node-version: ${{ inputs.node-version || '24' }}

  selected-package-ci:
    name: "Package CI · ${{ inputs.package-directory }}"
    needs: format
    if: ${{ always() && (needs.format.result == 'success' || needs.format.result == 'skipped') && github.event_name == 'workflow_dispatch' && inputs.package-directory != 'all' && inputs.package-directory != 'packages/moyarich-auto-glow-md' && inputs.package-directory != '@moyarich/auto-glow-md' }}
    uses: ./.github/workflows/reusable_node-ci.yml
    with:
      package-directory: ${{ inputs.package-directory }}
      node-version: ${{ inputs.node-version }}
    secrets: inherit
