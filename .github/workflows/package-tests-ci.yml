name: "Package . CI"

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package selector (all, package name, or packages/<directory>)
        required: true
        default: all
        type: string

      node-version:
        description: Node.js version used by CI
        required: true
        default: "24"
        type: string

  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

jobs:
  root-checks:
    name: "Root checks"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.package-directory == 'all' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: npm
          registry-url: https://npm.pkg.github.com

      - name: Install workspace dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Run root checks
        run: npm run checks

      - name: Checks summary
        if: ${{ always() }}
        run: |
          {
            echo "## Root checks"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Command | `npm run checks` |"
            echo "| Node.js | `${{ inputs.node-version || '24' }}` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"

  package-ci:
    name: "Package CI"
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.package-directory == 'all' }}
    uses: ./.github/workflows/reusable_package-ci.yml
    with:
      packages-directory: packages
      node-version: ${{ inputs.node-version || '24' }}

  selected-package-ci:
    name: "Package CI · ${{ inputs.package-directory }}"
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.package-directory != 'all' }}
    uses: ./.github/workflows/reusable_node-ci.yml
    with:
      package-directory: ${{ inputs.package-directory }}
      node-version: ${{ inputs.node-version }}
    secrets: inherit
