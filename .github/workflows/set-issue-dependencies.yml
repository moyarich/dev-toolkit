name: Set issue dependencies

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/set-issue-dependencies.yml'

permissions:
  contents: read
  issues: write

jobs:
  set-dependencies:
    name: Set native issue dependencies
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets._GITHUB_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Install GitHub CLI
        shell: bash
        run: |
          set -euo pipefail
          version=2.101.0
          case "$(uname -m)" in
            x86_64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "Unsupported runner architecture" >&2; exit 1 ;;
          esac
          cli_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            "https://github.com/cli/cli/releases/download/v${version}/gh_${version}_linux_${arch}.tar.gz" \
            | tar -xz -C "$cli_dir" --strip-components=1
          echo "$cli_dir/bin" >> "$GITHUB_PATH"

      - name: Apply dependencies
        shell: bash
        run: |
          set -euo pipefail

          ensure_blocked_by() {
            local issue="$1"
            local blocker="$2"

            if gh issue view "$issue" \
              --repo "$GH_REPO" \
              --json blockedBy \
              --jq '.blockedBy.nodes[].number' \
              | grep -Fxq "$blocker"; then
              echo "#$issue is already blocked by #$blocker"
              return
            fi

            echo "Setting #$issue as blocked by #$blocker"
            if [ "${ACT:-false}" = "true" ]; then
              echo "ACT preview: dependency was not changed."
              return
            fi
            gh issue edit "$issue" \
              --repo "$GH_REPO" \
              --add-blocked-by "$blocker"
          }

          ensure_blocked_by 2 3
          ensure_blocked_by 9 7

      - name: Show dependency state
        shell: bash
        run: |
          set -euo pipefail

          for issue in 2 3 7 9; do
            echo "## Issue #$issue" >> "$GITHUB_STEP_SUMMARY"
            gh issue view "$issue" \
              --repo "$GH_REPO" \
              --json blockedBy,blocking \
              >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
