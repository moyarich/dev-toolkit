name: Set issue dependencies

on:
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number or URL
        required: true
        type: string
      related_issues:
        description: Related issue numbers or URLs, comma-separated
        required: true
        type: string
      relationship:
        description: Dependency relationship
        required: true
        default: blocked-by
        type: choice
        options:
          - blocked-by
          - blocking
      action:
        description: Add or remove dependency
        required: true
        default: add
        type: choice
        options:
          - add
          - remove
      dry_run:
        description: Preview without applying changes
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write

jobs:
  manage-dependencies:
    name: Manage issue dependencies
    uses: moyarich/reusable-workflows/.github/workflows/reusable_manage-issue-dependencies.yml@v0
    with:
      issue: ${{ inputs.issue }}
      related_issues: ${{ inputs.related_issues }}
      relationship: ${{ inputs.relationship }}
      action: ${{ inputs.action }}
      dry_run: ${{ inputs.dry_run }}
