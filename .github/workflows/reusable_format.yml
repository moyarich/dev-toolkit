name: "Reusable · Format repository"

on:
  push:
    branches:
      - fix/package-release-drafter-first-release
    paths:
      - .github/workflows/reusable_format.yml

  workflow_dispatch:
    inputs:
      commit:
        description: Commit formatting changes
        required: true
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      commit:
        description: Commit formatting changes
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: false
        default: "24"
        type: string
    secrets:
      package-token:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  format:
    name: "Format repository"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: ${{ github.event_name == 'push' || inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version || '24' }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Install workspace dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
        run: npm ci --ignore-scripts

      - name: Format repository
        id: format
        shell: bash
        run: |
          set -euo pipefail

          npm run format

          git status --short > /tmp/format-status.txt

          if [ -s /tmp/format-status.txt ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit formatting changes
        if: ${{ (github.event_name == 'push' || inputs.commit) && steps.format.outputs.changed == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          git commit -m "style: format repository"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Format summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Format repository"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            printf '| Node.js | `%s` |\n' "${{ inputs.node-version || '24' }}"
            printf '| Commit requested | **%s** |\n' "${{ github.event_name == 'push' || inputs.commit }}"
            printf '| Branch | `%s` |\n' "${{ github.ref_name }}"
            echo "| Changes detected | **${{ steps.format.outputs.changed || 'unknown' }}** |"
            echo "| Result | **${{ job.status }}** |"

            if [ -s /tmp/format-status.txt ]; then
              echo
              echo "## Formatting changes"
              echo
              echo '~~~text'
              cat /tmp/format-status.txt
              echo '~~~'

              if [ "${{ github.event_name == 'push' || inputs.commit }}" != "true" ]; then
                echo
                echo "> [!NOTE]"
                echo "> Preview only. Formatting changes were not committed."
              fi
            else
              echo
              echo "No formatting changes were required."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
