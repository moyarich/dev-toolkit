name: Package . Workspace Tools . Release

run-name: >-
  Workspace Tools Release · ${{ inputs.target-branch }} · ${{ inputs.version-mode }} ·
  dry-run=${{ inputs.dry-run }} · publish=${{ inputs.publish }}

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: Release target branch
        required: true
        default: main
        type: string

      version-mode:
        description: Version — bump, use package.json, or enter an exact version
        required: true
        default: bump
        type: choice
        options:
          - bump
          - package-json
          - exact

      version-bump:
        description: Version — bump amount (used with "bump")
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

      exact-version:
        description: Version — exact version (used with "exact", e.g. 1.2.3)
        required: false
        default: ""
        type: string

      dry-run:
        description: Release — preview without making changes
        required: true
        default: true
        type: boolean

      publish:
        description: Publish — publish after creating the release
        required: true
        default: false
        type: boolean

      registry:
        description: Publish — where to publish
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
          - both

      dist-tag:
        description: Publish — distribution tag
        required: true
        default: latest
        type: string

      verify-git-tag:
        description: Safety — verify the matching release Git tag before publishing
        required: true
        default: true
        type: boolean

      node-version:
        description: Advanced — Node.js version
        required: true
        default: "24"
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.target-branch }}-
    ${{ inputs.exact-version || inputs.version-bump || inputs.version-mode }}
  cancel-in-progress: false

permissions: {}

jobs:
  release-approval:
    name: "job: Release approval"
    if: ${{ !inputs.dry-run }}
    runs-on: ubuntu-latest
    environment:
      name: release
    steps:
      - name: Record approval
        shell: bash
        run: |
          {
            echo "# Release approved"
            echo
            echo "A real package release was approved through the `release` environment."
            echo
            echo "| Environment | `release` |"
            echo "| Protection | Configure required reviewers/rules in **Settings → Environments → release** |"
            echo
            echo "> Dry runs do not require this approval."
            echo "> If the `release` environment did not already exist, GitHub may create it without protection rules; configure the environment before relying on it as an approval gate."
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: "package: @moyarich/workspace-tools | dir: packages/workspace-tools"
    needs: release-approval
    permissions:
      contents: write
      packages: write
    if: ${{ always() && (inputs.dry-run || needs.release-approval.result == 'success') }}
    uses: ./.github/workflows/reusable_npm-release.yml
    with:
      package: packages/workspace-tools
      target-branch: ${{ inputs.target-branch }}
      version-mode: ${{ inputs.version-mode }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}
      dry-run: ${{ inputs.dry-run }}
      publish: ${{ inputs.publish }}
      registry: ${{ inputs.registry }}
      dist-tag: ${{ inputs.dist-tag }}
      verify-git-tag: ${{ inputs.verify-git-tag }}
      node-version: ${{ inputs.node-version }}
    secrets:
      _NPM_TOKEN: ${{ secrets._NPM_TOKEN }}
