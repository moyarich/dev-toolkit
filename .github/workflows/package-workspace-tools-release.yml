name: Release workspace-tools

on:
  workflow_dispatch:
    inputs:
      version-mode:
        description: Version — bump, use existing, or enter an exact version
        required: true
        default: bump
        type: choice
        options:
          - bump
          - existing
          - exact

      version-bump:
        description: Version — bump amount (used with "bump")
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

      exact-version:
        description: Version — exact version (used with "exact", e.g. 1.2.3)
        required: false
        default: ""
        type: string

      dry-run:
        description: Release — preview without making changes
        required: true
        default: true
        type: boolean

      publish:
        description: Publish — publish after creating the release
        required: true
        default: false
        type: boolean

      registry:
        description: Publish — where to publish
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
          - both

      dist-tag:
        description: Publish — package tag (usually "latest")
        required: true
        default: latest
        type: string

      node-version:
        description: Advanced — Node.js version
        required: true
        default: "24"
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    uses: ./.github/workflows/reusable_npm-release.yml

    with:
      package: packages/workspace-tools
      version-mode: ${{ inputs.version-mode }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}
      dry-run: ${{ inputs.dry-run }}
      publish: ${{ inputs.publish }}
      registry: ${{ inputs.registry }}
      dist-tag: ${{ inputs.dist-tag }}
      node-version: ${{ inputs.node-version }}

    secrets:
      github-token: ${{ secrets._GITHUB_TOKEN }}
      npm-token: ${{ secrets._NPM_TOKEN }}
