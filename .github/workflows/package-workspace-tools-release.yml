name: Release workspace-tools

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version
        required: true
        default: current
        type: choice
        options:
          - current
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      custom-version:
        description: Custom SemVer (optional; overrides Version)
        required: false
        default: ""
        type: string
      action:
        description: Action
        required: true
        default: preview
        type: choice
        options:
          - preview
          - release
          - release-publish-github
          - release-publish-npm
          - release-publish-both
      tag:
        description: Distribution tag (publishing only)
        required: false
        default: latest
        type: string

jobs:
  release:
    uses: ./.github/workflows/npm-release.yml
    with:
      package-directory: packages/workspace-tools
      release-mode: ${{ inputs.custom-version != '' && 'exact' || (inputs.version == 'current' && 'current' || 'bump') }}
      release-bump: ${{ inputs.version }}
      exact-version: ${{ inputs.custom-version }}
      dry-run: ${{ inputs.action == 'preview' }}
      auto-publish: ${{ startsWith(inputs.action, 'release-publish-') }}
      registry: ${{ inputs.action == 'release-publish-npm' && 'npm' || (inputs.action == 'release-publish-both' && 'both' || 'github') }}
      tag: ${{ inputs.tag }}
      node-version: "22"
    secrets:
      github-token: ${{ secrets._GITHUB_TOKEN }}
      npm-token: ${{ secrets._NPM_TOKEN }}
