name: Reusable package release dry run

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        default: packages/workspace-tools
        type: string
      release-mode:
        description: Version selection mode
        required: true
        default: bump
        type: choice
        options:
          - bump
          - current
          - exact
      release-bump:
        description: SemVer bump when mode is bump
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      exact-version:
        description: Exact SemVer when mode is exact
        required: false
        default: ""
        type: string
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        type: string
      release-mode:
        description: bump, exact, or current
        required: false
        default: bump
        type: string
      release-bump:
        description: SemVer bump when release-mode is bump
        required: false
        default: patch
        type: string
      exact-version:
        description: Exact SemVer when release-mode is exact
        required: false
        default: ""
        type: string
      node-version:
        required: false
        default: "24"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Install workspace dependencies
        run: npm ci --include=optional
      - name: Restore tracked files after install
        run: git restore --worktree -- .
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Resolve release version
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          RELEASE_MODE: ${{ inputs.release-mode }}
          RELEASE_BUMP: ${{ inputs.release-bump }}
          EXACT_VERSION: ${{ inputs.exact-version }}
        run: |
          case "$RELEASE_MODE" in
            bump) RELEASE_VALUE="$RELEASE_BUMP" ;;
            exact) test -n "$EXACT_VERSION" || { echo "exact-version is required for exact mode"; exit 1; }; RELEASE_VALUE="$EXACT_VERSION" ;;
            current) RELEASE_VALUE="$(npm pkg get version --workspace "$PACKAGE_SELECTOR" | tr -d '"')" ;;
            *) echo "release-mode must be bump, exact, or current"; exit 1 ;;
          esac
          echo "RELEASE_VALUE=$RELEASE_VALUE" >> "$GITHUB_ENV"
      - name: Verify workspace
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
        run: npm pkg get name --workspace "$PACKAGE_SELECTOR"
      - run: echo "Workspace dependencies installed"
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Preview release
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          if [ -f packages/workspace-tools/bin/workspace-release.mjs ]; then
            node packages/workspace-tools/bin/workspace-release.mjs "${{ inputs.package-directory }}=$RELEASE_VALUE" --mode="${{ inputs.release-mode }}" --version="$RELEASE_VALUE" --dry-run
          else
            npx --yes @moyarich/workspace-tools workspace-release "${{ inputs.package-directory }}=$RELEASE_VALUE" --mode="${{ inputs.release-mode }}" --version="$RELEASE_VALUE" --dry-run
          fi
