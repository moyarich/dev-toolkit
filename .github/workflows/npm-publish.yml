name: Reusable npm publish

on:
  workflow_call:
    inputs:
      package-directory:
        description: Package location under packages/
        required: true
        type: string
      version:
        description: Exact version to publish; empty uses the current package.json version
        required: false
        default: ""
        type: string
      registry:
        description: github or npm
        required: false
        default: github
        type: string
      tag:
        description: npm distribution tag
        required: false
        default: latest
        type: string
      node-version:
        required: false
        default: "24"
        type: string
    secrets:
      github-token:
        required: false
      npm-token:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
      - name: Ensure staged publishing CLI support
        if: inputs.registry == 'npm'
        run: npm install --global npm@">=11.15.0 <12"
      - run: npm ci --include=optional
      - name: Resolve package and version
        env:
          PACKAGE_DIRECTORY: ${{ inputs.package-directory }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          case "$PACKAGE_DIRECTORY" in
            packages/*) ;;
            *) echo "Package location must be under packages/: $PACKAGE_DIRECTORY"; exit 1 ;;
          esac
          test -f "$PACKAGE_DIRECTORY/package.json"
          PACKAGE_KEY="${PACKAGE_DIRECTORY#packages/}"
          case "$PACKAGE_KEY" in
            ""|*/*|*[!A-Za-z0-9._-]*) echo "Invalid package directory: $PACKAGE_DIRECTORY"; exit 1 ;;
          esac
          CURRENT_VERSION="$(node -p "require('./$PACKAGE_DIRECTORY/package.json').version")"
          PUBLISH_VERSION="${REQUESTED_VERSION:-$CURRENT_VERSION}"
          if [ "$PUBLISH_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Requested publish version $PUBLISH_VERSION does not match package.json version $CURRENT_VERSION."
            exit 1
          fi
          echo "PACKAGE_KEY=$PACKAGE_KEY" >> "$GITHUB_ENV"
          echo "PUBLISH_VERSION=$PUBLISH_VERSION" >> "$GITHUB_ENV"
          echo "Publishing $PACKAGE_KEY@$PUBLISH_VERSION"
      - name: Publish package
        env:
          _GITHUB_TOKEN: ${{ secrets.github-token }}
          _NPM_TOKEN: ${{ secrets.npm-token }}
        run: |
          if [ -f packages/workspace-tools/bin/workspace-publish.mjs ]; then
            node packages/workspace-tools/bin/workspace-publish.mjs "$PACKAGE_KEY" --registry="${{ inputs.registry }}" --tag="${{ inputs.tag }}"
          else
            npx --yes @moyarich/workspace-tools workspace-publish "$PACKAGE_KEY" --registry="${{ inputs.registry }}" --tag="${{ inputs.tag }}"
          fi
