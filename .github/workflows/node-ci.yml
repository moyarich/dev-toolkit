name: Reusable Node CI

on:
  workflow_call:
    inputs:
      package-directory:
        description: Package directory containing package.json and package-lock.json
        required: false
        type: string
        default: "."
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "22"
    secrets:
      package-token:
        description: Token used to install packages from GitHub Packages
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.package-directory }}/package-lock.json
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - run: npm ci
        working-directory: ${{ inputs.package-directory }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
      - run: npm test
        working-directory: ${{ inputs.package-directory }}
      - run: npm run lint --if-present
        working-directory: ${{ inputs.package-directory }}
      - run: npm run typecheck --if-present
        working-directory: ${{ inputs.package-directory }}
