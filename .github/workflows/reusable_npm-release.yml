name: "Reusable · Release npm package"

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Dry-run — preview without making changes
        required: true
        default: true
        type: boolean

      package:
        description: Package — package to release
        required: true
        default: packages/workspace-tools
        type: string

      version-mode:
        description: Version — bump, use package.json, or enter an exact version
        required: true
        default: bump
        type: choice
        options:
          - bump
          - package-json
          - exact

      version-bump:
        description: Version — bump amount (used with "bump")
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

      exact-version:
        description: Version — exact version (used with "exact", e.g. 1.2.3)
        required: false
        default: ""
        type: string

      publish:
        description: Publish — publish after creating the release
        required: true
        default: false
        type: boolean

      registry:
        description: Publish — registry to publish to
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
          - both

      dist-tag:
        description: Publish — package tag (usually "latest")
        required: true
        default: latest
        type: string

      node-version:
        description: Advanced — Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      dry-run:
        description: Dry-run — preview without making changes
        required: true
        default: true
        type: boolean

      package:
        description: Package — package to release
        required: true
        type: string

      version-mode:
        description: Version — bump, use package.json, or enter an exact version
        required: false
        default: bump
        type: string

      version-bump:
        description: Version — bump amount (used with "bump")
        required: false
        default: patch
        type: string

      exact-version:
        description: Version — exact version (used with "exact", e.g. 1.2.3)
        required: false
        default: ""
        type: string

      publish:
        description: Publish — publish after creating the release
        required: false
        default: false
        type: boolean

      registry:
        description: Publish — registry to publish to
        required: false
        default: github
        type: string

      dist-tag:
        description: Publish — package tag (usually "latest")
        required: false
        default: latest
        type: string

      node-version:
        description: Advanced — Node.js version
        required: false
        default: "24"
        type: string

    secrets:
      _GITHUB_TOKEN:
        required: false

      _NPM_TOKEN:
        required: false

permissions:
  contents: write
  packages: write

jobs:
  release-package:
    name: "Release npm package"
    runs-on: ubuntu-latest

    env:
      GH_TOKEN: ${{ secrets._GITHUB_TOKEN || github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Reusable · Release npm package"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Workflow | \`Reusable · Release npm package\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets._GITHUB_TOKEN || github.token }}

      - name: Resolve execution mode
        id: execution
        env:
          INPUT_DRY_RUN: ${{ inputs.dry-run }}
          EVENT_DRY_RUN: ${{ github.event.inputs.dry-run }}
          ACT: ${{ env.ACT }}
        shell: bash
        run: |
          set -euo pipefail

          # act can resolve an omitted boolean input as false. Fail safe locally:
          # only an explicitly supplied workflow_dispatch value of false may
          # enable a real release under act.
          if [ "$ACT" = "true" ]; then
            case "$EVENT_DRY_RUN" in
              false)
                DRY_RUN=false
                ;;
              true|"")
                DRY_RUN=true
                ;;
              *)
                echo "::error::Invalid dry-run value: $EVENT_DRY_RUN"
                exit 1
                ;;
            esac
          elif [ "$INPUT_DRY_RUN" = "false" ]; then
            DRY_RUN=false
          else
            DRY_RUN=true
          fi

          echo "dry-run=$DRY_RUN" >> "$GITHUB_OUTPUT"
          echo "Dry run: $DRY_RUN"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Execution mode: preview only; repository mutation is disabled."
          else
            echo "Execution mode: real release."
          fi

      - name: Configure GitHub remote
        if: ${{ steps.execution.outputs.dry-run == 'false' }}
        env:
          GH_TOKEN: ${{ secrets._GITHUB_TOKEN || github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "::error::A GitHub token is required for release operations."
            exit 1
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Install workspace dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets._GITHUB_TOKEN || github.token }}
        run: npm ci --include=optional

      - name: Resolve workspace tools CLI
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets._GITHUB_TOKEN || github.token }}
        run: |
          set -euo pipefail

          if [ -f packages/workspace-tools/package.json ]; then
            npm run build --workspace @moyarich/workspace-tools
            echo "WORKSPACE_TOOLS_BIN=$GITHUB_WORKSPACE/packages/workspace-tools/bin" >> "$GITHUB_ENV"
          else
            TOOL_ROOT="$RUNNER_TEMP/workspace-tools"
            rm -rf "$TOOL_ROOT"
            mkdir -p "$TOOL_ROOT"
            npm install \
              --prefix "$TOOL_ROOT" \
              --package-lock=false \
              --ignore-scripts \
              --registry=https://npm.pkg.github.com \
              @moyarich/workspace-tools
            echo "WORKSPACE_TOOLS_BIN=$TOOL_ROOT/node_modules/.bin" >> "$GITHUB_ENV"
          fi

      - name: Restore tracked files after build
        run: git restore --worktree -- .

      - name: Validate release inputs
        env:
          VERSION_MODE: ${{ inputs.version-mode }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          EXACT_VERSION: ${{ inputs.exact-version }}
          REGISTRY: ${{ inputs.registry }}
          DIST_TAG: ${{ inputs.dist-tag }}
        shell: bash
        run: |
          set -euo pipefail

          case "$VERSION_MODE" in
            bump|package-json|exact)
              ;;
            *)
              echo "::error::Version selection must be bump, package-json, or exact."
              exit 1
              ;;
          esac

          case "$VERSION_BUMP" in
            patch|minor|major|prepatch|preminor|premajor|prerelease)
              ;;
            *)
              echo "::error::Invalid version bump: $VERSION_BUMP"
              exit 1
              ;;
          esac

          if [ "$VERSION_MODE" = "exact" ] && [ -z "$EXACT_VERSION" ]; then
            echo "::error::Exact version is required when version selection is exact."
            exit 1
          fi

          case "$REGISTRY" in
            github|npm|both)
              ;;
            *)
              echo "::error::Registry must be github, npm, or both."
              exit 1
              ;;
          esac

          if [ -z "$DIST_TAG" ]; then
            echo "::error::Distribution tag cannot be empty."
            exit 1
          fi

      - name: Validate publishing credentials
        if: ${{ steps.execution.outputs.dry-run == 'false' && inputs.publish }}
        env:
          GITHUB_TOKEN_VALUE: ${{ secrets._GITHUB_TOKEN || github.token }}
          NPM_TOKEN_VALUE: ${{ secrets._NPM_TOKEN }}
          REGISTRY: ${{ inputs.registry }}
        shell: bash
        run: |
          set -euo pipefail

          case "$REGISTRY" in
            github)
              if [ -z "$GITHUB_TOKEN_VALUE" ]; then
                echo "::error::_GITHUB_TOKEN or github.token is required to publish to GitHub Packages."
                exit 1
              fi
              ;;

            npm)
              if [ -z "$NPM_TOKEN_VALUE" ]; then
                echo "::error::_NPM_TOKEN is required to publish to npm."
                exit 1
              fi
              ;;

            both)
              if [ -z "$GITHUB_TOKEN_VALUE" ]; then
                echo "::error::_GITHUB_TOKEN or github.token is required to publish to GitHub Packages."
                exit 1
              fi

              if [ -z "$NPM_TOKEN_VALUE" ]; then
                echo "::error::_NPM_TOKEN is required to publish to npm."
                exit 1
              fi
              ;;
          esac

      - name: Configure release author
        if: ${{ steps.execution.outputs.dry-run == 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve release version
        env:
          VERSION_MODE: ${{ inputs.version-mode }}
          VERSION_BUMP: ${{ inputs.version-bump }}
          EXACT_VERSION: ${{ inputs.exact-version }}
        shell: bash
        run: |
          set -euo pipefail

          case "$VERSION_MODE" in
            bump)
              VERSION_REQUEST="$VERSION_BUMP"
              ;;

            package-json)
              VERSION_REQUEST=""
              ;;

            exact)
              VERSION_REQUEST="$EXACT_VERSION"
              ;;
          esac

          echo "VERSION_REQUEST=$VERSION_REQUEST" >> "$GITHUB_ENV"

      - name: Verify clean working tree
        shell: bash
        run: |
          set -euo pipefail

          STATUS="$(git status --short)"

          if [ -n "$STATUS" ]; then
            echo "::error::Working tree is not clean before release."
            echo
            echo "$STATUS"
            echo

            {
              echo
              echo "## Working tree"
              echo
              echo "> [!CAUTION]"
              echo "> The release cannot continue because the working tree is not clean."
              echo
              echo '```text'
              echo "$STATUS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"

            exit 1
          fi

          echo "Working tree is clean."

      - name: Capture dry-run repository state
        if: ${{ steps.execution.outputs.dry-run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > /tmp/release-head-before
          git status --porcelain=v1 --untracked-files=all > /tmp/release-status-before
          git tag --list | sort > /tmp/release-tags-before

      - name: Release or preview package
        env:
          DRY_RUN: ${{ steps.execution.outputs.dry-run }}
          VERSION_MODE: ${{ inputs.version-mode }}
          PUBLISH: ${{ inputs.publish }}
          REGISTRY: ${{ inputs.registry }}
          DIST_TAG: ${{ inputs.dist-tag }}
          GIT_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          DRY_RUN_FLAG=""

          if [ "$DRY_RUN" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi

          RELEASE_ARGS=(
            "${{ inputs.package }}"
            "--mode=$VERSION_MODE"
            "--json"
          )

          if [ "$VERSION_MODE" != "package-json" ]; then
            RELEASE_ARGS[0]="${{ inputs.package }}=$VERSION_REQUEST"
            RELEASE_ARGS+=("--version=$VERSION_REQUEST")
          fi

          if [ "$DRY_RUN" = "true" ]; then
            RELEASE_ARGS+=("--dry-run")
          fi

          RELEASE_JSON="$(
            "$WORKSPACE_TOOLS_BIN/workspace-release" "${RELEASE_ARGS[@]}"
          )"

          echo "$RELEASE_JSON" | jq -e '
            type == "object" and
            .operation == "release" and
            (.package.name | type == "string" and length > 0) and
            (.currentVersion | type == "string" and length > 0) and
            (.nextVersion | type == "string" and length > 0)
          ' >/dev/null

          PACKAGE_NAME="$(jq -r '.package.name' <<< "$RELEASE_JSON")"
          PACKAGE_SELECTOR="$(jq -r '.package.selector' <<< "$RELEASE_JSON")"
          PACKAGE_VERSION="$(jq -r '.currentVersion' <<< "$RELEASE_JSON")"

          {
            echo "PACKAGE_NAME=$PACKAGE_NAME"
            echo "PACKAGE_SELECTOR=$PACKAGE_SELECTOR"
            echo "PACKAGE_VERSION=$PACKAGE_VERSION"
          } >> "$GITHUB_ENV"

          {
            echo "# Package release"
            echo

            echo "## Package"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`$GH_REPO\` |"
            echo "| Package selector | `${{ inputs.package }}` |"
            echo "| Git ref | \`$GIT_REF\` |"
            echo

            echo "## Release configuration"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Version selection | \`$VERSION_MODE\` |"
            echo "| Version request | \`${VERSION_REQUEST:-package.json version}\` |"
            echo "| Dry run | **$DRY_RUN** |"
            echo "| Publish after release | **$PUBLISH** |"

            if [ "$PUBLISH" = "true" ]; then
              echo "| Publish registry | \`$REGISTRY\` |"
              echo "| Distribution tag | \`$DIST_TAG\` |"
            fi

            echo

            if [ "$DRY_RUN" = "true" ]; then
              echo "> [!NOTE]"
              echo "> **Preview only.** No files, commits, Git tags, pushes, or packages will be changed."
            elif [ "$PUBLISH" = "true" ]; then
              echo "> [!IMPORTANT]"
              echo "> This run will create and push the release commit and Git tag, then publish the package."
            else
              echo "> [!IMPORTANT]"
              echo "> This run will create and push the release commit and Git tag. Package publishing is disabled."
            fi

            echo
            echo "## Release details"
            echo
            echo '~~~json'
            echo "$RELEASE_JSON" | jq .
            echo '~~~'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Verify dry run made no repository changes
        if: ${{ steps.execution.outputs.dry-run == 'true' }}
        shell: bash
        run: |
          set -euo pipefail

          git rev-parse HEAD > /tmp/release-head-after
          git status --porcelain=v1 --untracked-files=all > /tmp/release-status-after
          git tag --list | sort > /tmp/release-tags-after

          if ! cmp -s /tmp/release-head-before /tmp/release-head-after || \
             ! cmp -s /tmp/release-status-before /tmp/release-status-after || \
             ! cmp -s /tmp/release-tags-before /tmp/release-tags-after; then
            echo "::error::Dry run modified repository state."
            echo "Repository status after dry run:"
            git status --short
            exit 1
          fi

          echo "Dry-run verification passed: repository state is unchanged."

      - name: Push release commit and tag
        if: ${{ steps.execution.outputs.dry-run == 'false' }}
        shell: bash
        run: |
          set -euo pipefail

          git push origin \
            "HEAD:$GITHUB_REF_NAME" \
            --follow-tags

      - name: Ensure staged publishing CLI support
        if: ${{ steps.execution.outputs.dry-run == 'false' && inputs.publish && inputs.registry != 'github' }}
        shell: bash
        run: |
          set -euo pipefail

          npm install --global npm@">=11.15.0 <12"

      - name: Publish released version
        if: ${{ steps.execution.outputs.dry-run == 'false' && inputs.publish }}
        env:
          _GITHUB_TOKEN: ${{ secrets._GITHUB_TOKEN || github.token }}
          _NPM_TOKEN: ${{ secrets._NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          {
            echo
            echo "## Publishing"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Package | \`$PACKAGE_NAME\` |"
            echo "| Package selector | \`$PACKAGE_SELECTOR\` |"
            echo "| Registry | \`${{ inputs.registry }}\` |"
            echo "| Distribution tag | \`${{ inputs.dist-tag }}\` |"
            echo
            echo '```text'

            PUBLISH_JSON="$(
              "$WORKSPACE_TOOLS_BIN/workspace-publish" \
                "$PACKAGE_SELECTOR" \
                --registry="${{ inputs.registry }}" \
                --tag="${{ inputs.dist-tag }}" \
                --json
            )"

            echo "$PUBLISH_JSON" | jq -e '
              type == "object" and
              .operation == "publish" and
              .status == "success"
            ' >/dev/null

            echo "$PUBLISH_JSON" | jq .

            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Release result
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo
            echo "## Result"
            echo

            if [ "${{ job.status }}" != "success" ]; then
              echo "### ❌ Release failed"
              echo
              echo "Review the workflow logs above for the failing step."

            elif [ "${{ steps.execution.outputs.dry-run }}" = "true" ]; then
              echo "### ✅ Release preview completed"
              echo
              echo "No files, commits, tags, pushes, or package publishing were performed."

            elif [ "${{ inputs.publish }}" = "true" ]; then
              echo "### ✅ Release and publish completed"
              echo
              echo "Published to: \`${{ inputs.registry }}\`"

            else
              echo "### ✅ Release completed"
              echo
              echo "Package release completed. Publishing was not requested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
