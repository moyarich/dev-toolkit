name: "Jest to Vitest"

on:
  workflow_dispatch:
    inputs:
      target-directory:
        description: "Directory to migrate (repository-relative)"
        required: true
        default: "."
        type: string

      commit-changes:
        description: "Commit and push codemod changes back to this branch"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: jest-to-vitest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    name: "Codemod · Jest → Vitest"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Validate target directory
        shell: bash
        run: |
          set -euo pipefail

          target="${{ inputs.target-directory }}"

          if [[ "$target" == /* || "$target" == *".."* ]]; then
            echo "::error::target-directory must be a repository-relative path and cannot contain '..'."
            exit 1
          fi

          if [[ ! -d "$target" ]]; then
            echo "::error::Directory does not exist: $target"
            exit 1
          fi

      - name: Run Jest to Vitest codemod
        working-directory: ${{ inputs.target-directory }}
        run: npx --yes codemod jest/vitest

      - name: Show migration changes
        shell: bash
        run: |
          git status --short
          git diff --stat
          git diff

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Write workflow summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Jest → Vitest codemod"
            echo
            echo "- Target: \`${{ inputs.target-directory }}\`"
            echo "- Branch: \`${{ github.ref_name }}\`"
            echo "- Commit changes: \`${{ inputs.commit-changes }}\`"
            echo
            echo "### Changed files"
            echo
            echo '~~~text'
            git status --short
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit migration changes
        if: ${{ success() && inputs.commit-changes }}
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet && git diff --cached --quiet && [[ -z "$(git ls-files --others --exclude-standard)" ]]; then
            echo "No migration changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          git commit -m "refactor: migrate Jest tests to Vitest"
          git push origin "HEAD:${{ github.ref_name }}"
