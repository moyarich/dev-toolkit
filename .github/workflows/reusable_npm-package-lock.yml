name: "Reusable · Recreate workspace package-lock.json"

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit recreated package-lock.json
        required: true
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

  workflow_call:
    inputs:
      commit:
        description: Commit recreated package-lock.json
        required: false
        default: false
        type: boolean
      node-version:
        description: Node.js version
        required: false
        default: "24"
        type: string
    secrets:
      package-token:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  recreate-lockfile:
    name: "Recreate workspace package-lock.json"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: ${{ inputs.commit }}
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"

      - name: Install workspace tools
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
        run: npm ci --ignore-scripts

      - name: Resolve workspace tools CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f packages/workspace-tools/package.json ]; then
            npm run build
            TOOL_PACKAGE_ROOT="$(cd packages/workspace-tools && pwd -P)"
          else
            TOOL_ROOT="$(mktemp -d "$RUNNER_TEMP/workspace-tools.XXXXXX")"
            npm install --prefix "$TOOL_ROOT" --package-lock=false --ignore-scripts @moyarich/workspace-tools@latest
            TOOL_PACKAGE_ROOT="$TOOL_ROOT/node_modules/@moyarich/workspace-tools"
          fi
          test -f "$TOOL_PACKAGE_ROOT/bin/workspace-package-lock.mjs"
          echo "WORKSPACE_TOOLS_ROOT=$TOOL_PACKAGE_ROOT" >> "$GITHUB_ENV"

      - name: Recreate package-lock.json
        id: lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
        shell: bash
        run: |
          set -euo pipefail

          args=(--json)

          if [ "${{ inputs.commit }}" = "true" ]; then
            args+=(--commit --branch "${{ github.ref_name }}")
          else
            args+=(--dry-run)
          fi

          node "$WORKSPACE_TOOLS_ROOT/bin/workspace-package-lock.mjs" "${args[@]}" | tee /tmp/package-lock-result.json

      - name: Package-lock summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Recreate workspace package-lock.json"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Commit requested | **${{ inputs.commit }}** |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Result | **${{ job.status }}** |"

            if [ -s /tmp/package-lock-result.json ]; then
              echo
              echo "## Result"
              echo
              echo '\`\`\`json'
              cat /tmp/package-lock-result.json
              echo '\`\`\`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
