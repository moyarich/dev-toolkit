name: -[Reusable] Update workspace lockfile

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit package-lock.json changes
        required: true
        default: true
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "22"
        type: string
  workflow_call:
    inputs:
      commit:
        description: Commit package-lock.json changes
        required: false
        default: false
        type: boolean
      node-version:
        required: false
        default: "22"
        type: string
    secrets:
      package-token:
        required: false

permissions:
  contents: write
  packages: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Update workspace lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
        run: npm install --package-lock-only
      - name: Verify workspace lockfile
        run: test -f package-lock.json
      - name: Commit workspace lockfile
        if: ${{ inputs.commit && env.ACT != 'true' }}
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(workspaces): update package lockfile"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Lockfile summary
        if: ${{ always() }}
        run: |
          {
            echo "## Workspace lockfile"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Commit changes | **${{ inputs.commit && env.ACT != 'true' }}** |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
