name: Playground Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/playground/**"
      - "packages/demo-tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playground-pages.yml"
      - ".github/workflows/reusable_github-pages.yml"

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  pages:
    name: "site: Playground | dir: apps/playground"
    uses: moyarich/actions/.github/workflows/reusable_github-pages.yml@d430b304d667341f76cadaba64bfdbb23d3685d2
    with:
      build-command: npm run build
      output-directory: apps/playground/dist
      install-command: npm ci --include=optional
      working-directory: "."
