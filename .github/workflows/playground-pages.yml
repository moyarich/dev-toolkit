name: Playground Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/playground/**"
      - "packages/demo-tools/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/playground-pages.yml"
      - ".github/workflows/reusable_github-pages.yml"

  workflow_dispatch:

jobs:
  pages:
    uses: ./.github/workflows/reusable_github-pages.yml
    with:
      build-command: npm run build --workspace @moyarich/demo-tools-playground
      output-directory: apps/playground/dist
      node-version: "24"
      install-command: npm ci --include=optional
      working-directory: "."
