name: "Temporary · Sync Storybook test lockfile"

on:
  push:
    branches:
      - fix/package-release-drafter-first-release
    paths:
      - packages/web-components/package.json
      - .github/workflows/tmp-sync-storybook-tests-lock.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Sync package-lock.json
        run: npm install --package-lock-only --include=optional

      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync Storybook test lockfile"
          git push
