name: External reusable release contract

on:
  pull_request:
    paths:
      - .github/workflows/external-reusable-release-contract.yml
  workflow_dispatch:

permissions: {}

jobs:
  select:
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_select-release-packages.yml@v0
    with:
      packages-json: '[{"name":"external-fixture","directory":"."}]'
      package: external-fixture
      event-name: workflow_dispatch
      after-sha: ${{ github.sha }}
      target-branch: ${{ github.sha }}
      version-mode: bump
      version-bump: patch

  parameters:
    permissions:
      contents: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_dispatch-input-summary.yml@v0
    with:
      parameters-json: '{"package":"external-fixture","dry-run":true,"apiKey":"placeholder"}'
      heading: External consumer input contract

  assert:
    needs: [select, parameters]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Assert reusable outputs
        env:
          MATRIX_JSON: ${{ needs.select.outputs.matrix }}
          COUNT: ${{ needs.select.outputs.count }}
          VERSION_MODE: ${{ needs.select.outputs.version-mode }}
        shell: bash
        run: |
          set -euo pipefail
          test "$COUNT" = "1"
          test "$VERSION_MODE" = "bump"
          jq -e '.include | length == 1 and .[0].name == "external-fixture" and .[0].directory == "."' <<< "$MATRIX_JSON"

  draft-preview:
    permissions:
      contents: write
      pull-requests: read
    uses: moyarich/reusable-workflows/.github/workflows/reusable_release-drafter.yml@v0
    with:
      show-input-summary: false
      target-branch: main
      package-name: external-fixture
      target-key: external-contract-fixture
      release-name: 'External fixture v{{VERSION}}'
      dry-run: true

  assert-draft:
    needs: draft-preview
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Assert dry-run result
        env:
          VERSION: ${{ needs.draft-preview.outputs.version }}
          TAG: ${{ needs.draft-preview.outputs.tag }}
          ACTION: ${{ needs.draft-preview.outputs.draft-action }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERSION"
          test -n "$TAG"
          test "$TAG" != "null"
          test "$ACTION" = "previewed"

