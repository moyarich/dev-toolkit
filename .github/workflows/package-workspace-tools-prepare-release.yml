name: Package . Workspace Tools . Prepare Release

run-name: >-
  Workspace Tools Prepare · ${{ inputs.target-branch }} ·
  ${{ inputs.exact-version || inputs.version-bump || inputs.version-mode }}

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: Release target branch
        required: true
        default: main
        type: string
      version-mode:
        description: Version — bump or exact
        required: true
        default: bump
        type: choice
        options:
          - bump
          - exact
      version-bump:
        description: Version — bump amount
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      exact-version:
        description: Version — exact version
        required: false
        default: ""
        type: string
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string

concurrency:
  group: >-
    ${{ github.workflow }}-${{ inputs.target-branch }}-
    ${{ inputs.exact-version || inputs.version-bump || inputs.version-mode }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    name: "package: @moyarich/workspace-tools | dir: packages/workspace-tools"
    uses: ./.github/workflows/reusable_npm-prepare-release.yml
    with:
      package: packages/workspace-tools
      target-branch: ${{ inputs.target-branch }}
      version-mode: ${{ inputs.version-mode }}
      version-bump: ${{ inputs.version-bump }}
      exact-version: ${{ inputs.exact-version }}
      node-version: ${{ inputs.node-version }}
    secrets:
      github-token: ${{ secrets._GITHUB_TOKEN }}
