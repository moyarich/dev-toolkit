name: "Reusable · Publish npm package"

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview publishing without registry mutation
        required: true
        default: true
        type: boolean
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        default: packages/workspace-tools
        type: string
      version:
        description: Exact version to publish; empty uses package.json
        required: false
        default: ""
        type: string
      registry:
        description: Package registry
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
      tag:
        description: Distribution tag
        required: true
        default: latest
        type: string
      verify-git-tag:
        description: Verify matching package release Git tag before publishing
        required: true
        default: true
        type: boolean
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      dry-run:
        description: Preview publishing without registry mutation
        required: false
        default: true
        type: boolean
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        type: string
      version:
        description: Exact version to publish; empty uses the current package.json version
        required: false
        default: ""
        type: string
      registry:
        description: github or npm
        required: false
        default: github
        type: string
      tag:
        description: npm distribution tag
        required: false
        default: latest
        type: string
      verify-git-tag:
        description: Verify matching package release Git tag before publishing
        required: false
        default: true
        type: boolean
      node-version:
        required: false
        default: "24"
        type: string
    outputs:
      package-name:
        description: Resolved package name
        value: ${{ jobs.publish-package.outputs.package-name }}
      package-version:
        description: Resolved package version
        value: ${{ jobs.publish-package.outputs.package-version }}
      publish-status:
        description: Publish result status
        value: ${{ jobs.publish-package.outputs.publish-status }}
      can-publish:
        description: Whether publish readiness checks passed
        value: ${{ jobs.publish-package.outputs.can-publish }}
      result-json:
        description: Complete workspace-publish JSON result
        value: ${{ jobs.publish-package.outputs.result-json }}
    secrets:
      github-token:
        required: false
      npm-token:
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish-package:
    name: "Publish npm package"
    runs-on: ubuntu-latest
    outputs:
      package-name: ${{ steps.plan.outputs.name }}
      package-version: ${{ steps.plan.outputs.version }}
      publish-status: ${{ steps.publish.outputs.status }}
      can-publish: ${{ steps.publish.outputs.can-publish }}
      result-json: ${{ steps.publish.outputs.result-json }}
    env:
      GH_TOKEN: ${{ secrets.github-token || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Reusable · Publish npm package"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Workflow | \`Reusable · Publish npm package\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Ensure staged publishing CLI support
        if: inputs.registry == 'npm'
        run: npm install --global npm@">=11.15.0 <12"
      - name: Install workspace dependencies
        run: npm ci --include=optional

      - name: Resolve workspace tools CLI
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.github-token || github.token }}
        run: |
          set -euo pipefail

          if [ -f packages/workspace-tools/package.json ]; then
            npm run build --workspace @moyarich/workspace-tools
            TOOL_BIN_DIR="$RUNNER_TEMP/workspace-tools-bin"
            rm -rf "$TOOL_BIN_DIR"
            mkdir -p "$TOOL_BIN_DIR"
            npm install               --prefix "$TOOL_BIN_DIR"               --package-lock=false               --ignore-scripts               "$GITHUB_WORKSPACE/packages/workspace-tools"
            echo "WORKSPACE_TOOLS_BIN=$TOOL_BIN_DIR/node_modules/.bin" >> "$GITHUB_ENV"
          else
            TOOL_ROOT="$RUNNER_TEMP/workspace-tools"
            rm -rf "$TOOL_ROOT"
            mkdir -p "$TOOL_ROOT"
            npm install \
              --prefix "$TOOL_ROOT" \
              --package-lock=false \
              --ignore-scripts \
              --registry=https://npm.pkg.github.com \
              @moyarich/workspace-tools
            echo "WORKSPACE_TOOLS_BIN=$TOOL_ROOT/node_modules/.bin" >> "$GITHUB_ENV"
          fi
      - name: Resolve publish plan
        id: plan
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
        shell: bash
        run: |
          PLAN="$(
            "$WORKSPACE_TOOLS_BIN/workspace-publish" \
              "$PACKAGE_SELECTOR" \
              --registry="${{ inputs.registry }}" \
              --tag="${{ inputs.tag }}" \
              --list \
              --json
          )"

          echo "$PLAN" | jq -e '
            type == "object" and
            (.packages | type == "array" and length >= 1) and
            (.packages[0].name | type == "string" and length > 0) and
            (.packages[0].version | type == "string" and length > 0)
          ' >/dev/null

          {
            echo "name=$(jq -r '.packages[0].name' <<< "$PLAN")"
            echo "version=$(jq -r '.packages[0].version' <<< "$PLAN")"
          } >> "$GITHUB_OUTPUT"

      - name: Validate requested version
        if: ${{ inputs.version != '' }}
        env:
          CURRENT_VERSION: ${{ steps.plan.outputs.version }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ "$REQUESTED_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Requested publish version $REQUESTED_VERSION does not match package version $CURRENT_VERSION."
            exit 1
          fi
      - name: Publish package
        id: publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          VERIFY_GIT_TAG: ${{ inputs.verify-git-tag }}
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          _GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          _NPM_TOKEN: ${{ secrets.npm-token }}
        run: |
          set -euo pipefail

          PUBLISH_ARGS=(
            "$PACKAGE_SELECTOR"
            --registry="${{ inputs.registry }}"
            --tag="${{ inputs.tag }}"
            --json
          )

          if [ "$DRY_RUN" = "true" ]; then
            PUBLISH_ARGS+=(--dry-run)
          fi

          if [ "$VERIFY_GIT_TAG" != "true" ]; then
            PUBLISH_ARGS+=(--no-verify-git-tag)
          fi

          RESULT="$(
            "$WORKSPACE_TOOLS_BIN/workspace-publish" "${PUBLISH_ARGS[@]}"
          )"

          echo "$RESULT" | jq -e --argjson dryRun "$DRY_RUN" '
            type == "object" and
            .operation == "publish" and
            .dryRun == $dryRun and
            (
              if $dryRun
              then (.status == "preview" or .status == "warning")
              else .status == "success"
              end
            )
          ' >/dev/null

          {
            echo "status=$(jq -r '.status' <<< "$RESULT")"
            echo "can-publish=$(jq -r 'if has("canPublish") then .canPublish else true end' <<< "$RESULT")"
            echo "result-json<<EOF"
            echo "$RESULT" | jq -c .
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "$RESULT" | jq .

      - name: Publish summary
        if: ${{ always() }}
        run: |
          {
            echo "## Package publish"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Dry run | **${{ inputs.dry-run }}** |"
            echo "| Package | \`${{ steps.plan.outputs.name || inputs.package-directory }}\` |"
            echo "| Package version | \`${{ steps.plan.outputs.version || 'unresolved' }}\` |"
            echo "| Requested version | \`${{ inputs.version || 'package version' }}\` |"
            echo "| Registry | \`${{ inputs.registry }}\` |"
            echo "| Distribution tag | \`${{ inputs.tag }}\` |"
            echo "| Verify Git release tag | **${{ inputs.verify-git-tag }}** |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Publish status | \`${{ steps.publish.outputs.status || 'unresolved' }}\` |"
            echo "| Can publish | **${{ steps.publish.outputs.can-publish || 'unresolved' }}** |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
