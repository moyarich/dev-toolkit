name: -[Reusable] Npm publish

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        default: packages/workspace-tools
        type: string
      version:
        description: Exact version to publish; empty uses package.json
        required: false
        default: ""
        type: string
      registry:
        description: Package registry
        required: true
        default: github
        type: choice
        options:
          - github
          - npm
      tag:
        description: Distribution tag
        required: true
        default: latest
        type: string
      node-version:
        description: Node.js version
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: true
        type: string
      version:
        description: Exact version to publish; empty uses the current package.json version
        required: false
        default: ""
        type: string
      registry:
        description: github or npm
        required: false
        default: github
        type: string
      tag:
        description: npm distribution tag
        required: false
        default: latest
        type: string
      node-version:
        required: false
        default: "24"
        type: string
    secrets:
      github-token:
        required: false
      npm-token:
        required: false

concurrency:
  group: npm-publish-${{ inputs.package-directory }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.github-token || github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Ensure staged publishing CLI support
        if: inputs.registry == 'npm'
        run: npm install --global npm@">=11.15.0 <12"
      - name: Install workspace dependencies
        run: npm ci --include=optional
      - name: Validate requested version
        if: ${{ inputs.version != '' }}
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          CURRENT_VERSION="$(npm pkg get version --workspace "$PACKAGE_SELECTOR" | tr -d '"')"
          if [ "$REQUESTED_VERSION" != "$CURRENT_VERSION" ]; then
            echo "Requested publish version $REQUESTED_VERSION does not match package.json version $CURRENT_VERSION."
            exit 1
          fi
      - name: Publish package
        env:
          PACKAGE_SELECTOR: ${{ inputs.package-directory }}
          _GITHUB_TOKEN: ${{ secrets.github-token || github.token }}
          _NPM_TOKEN: ${{ secrets.npm-token }}
        run: |
          if [ -f packages/workspace-tools/bin/workspace-publish.mjs ]; then
            node packages/workspace-tools/bin/workspace-publish.mjs "$PACKAGE_SELECTOR" --registry="${{ inputs.registry }}" --tag="${{ inputs.tag }}"
          else
            npx --yes @moyarich/workspace-tools workspace-publish "$PACKAGE_SELECTOR" --registry="${{ inputs.registry }}" --tag="${{ inputs.tag }}"
          fi

      - name: Publish summary
        if: ${{ always() }}
        run: |
          {
            echo "## Package publish"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ inputs.package-directory }}\` |"
            echo "| Requested version | \`${{ inputs.version || 'package.json' }}\` |"
            echo "| Registry | \`${{ inputs.registry }}\` |"
            echo "| Distribution tag | \`${{ inputs.tag }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
