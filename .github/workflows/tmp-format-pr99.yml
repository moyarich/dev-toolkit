name: Temporary format PR 99

on:
  push:
    branches:
      - refactor/shared-release-identity

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - run: npm ci --include=optional

      - name: Format changed release files
        run: |
          npx prettier@3.9.9             .github/workflows/release-drafter.yml             docs/02-guides/04-package-release-workflow/page.mdx             tests/workflows/package-release-drafter.test.ts             tests/workflows/release-preparation.test.ts             --write

          git diff --binary > "$RUNNER_TEMP/formatted.patch"

      - uses: actions/upload-artifact@v7
        with:
          name: pr99-formatted-patch
          path: ${{ runner.temp }}/formatted.patch
          if-no-files-found: error
