name: "Temporary · Format dependency cruiser config"

on:
  push:
    branches:
      - refactor/shared-release-identity

permissions:
  contents: read

jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Show exact Prettier diff
        shell: bash
        run: |
          set -euo pipefail
          npx --yes prettier@3.9.9 .dependency-cruiser.cjs --write
          git diff -- .dependency-cruiser.cjs
