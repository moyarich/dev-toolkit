name: "Reusable · Node CI"

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package directory
        required: true
        default: packages/workspace-tools
        type: choice
        options:
          - packages/demo-tools
          - packages/readme-screenshots
          - packages/web-components
          - packages/workspace-tools
      node-version:
        description: Node.js version used by CI
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: false
        type: string
        default: "."
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
    secrets:
      package-token:
        description: Token used to install packages from GitHub Packages
        required: false

jobs:
  test-node-project:
    name: "Test Node project"
    runs-on: ubuntu-latest
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Reusable · Node CI"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Workflow | \`Reusable · Node CI\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Install workspace dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
      - name: Test
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm test; else npm test --workspace "$WORKSPACE"; fi
      - name: Lint
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run lint --if-present; else npm run lint --workspace "$WORKSPACE" --if-present; fi
      - name: Typecheck
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run typecheck --if-present; else npm run typecheck --workspace "$WORKSPACE" --if-present; fi

      - name: CI summary
        if: ${{ always() }}
        run: |
          {
            echo "## Node CI"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Workspace | \`${{ inputs.package-directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
