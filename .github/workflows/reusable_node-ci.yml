name: "Node CI (Reusable)"

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package directory
        required: true
        default: packages/workspace-tools
        type: choice
        options:
          - packages/demo-tools
          - packages/readme-screenshots
          - packages/web-components
          - packages/workspace-tools
      node-version:
        description: Node.js version used by CI
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: false
        type: string
        default: "."
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
    secrets:
      package-token:
        description: Token used to install packages from GitHub Packages
        required: false

jobs:
  test-node-project:
    name: "Test Node project"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Install workspace dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
      - name: Test
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm test; else npm test --workspace "$WORKSPACE"; fi
      - name: Lint
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run lint --if-present; else npm run lint --workspace "$WORKSPACE" --if-present; fi
      - name: Typecheck
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run typecheck --if-present; else npm run typecheck --workspace "$WORKSPACE" --if-present; fi

      - name: CI summary
        if: ${{ always() }}
        run: |
          {
            echo "## Node CI"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Workspace | \`${{ inputs.package-directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
