name: "Reusable · Node CI"

on:
  workflow_dispatch:
    inputs:
      package-directory:
        description: Package directory
        required: true
        default: packages/workspace-tools
        type: choice
        options:
          - packages/demo-tools
          - packages/readme-screenshots
          - packages/vite-plugin-package-bin
          - packages/vs-code-ext-tools
          - packages/web-components
          - packages/workspace-tools
      node-version:
        description: Node.js version used by CI
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      package-directory:
        description: Workspace path, directory name, or package name
        required: false
        type: string
        default: "."
      node-version:
        description: Node.js version used by CI
        required: false
        type: string
        default: "24"
      prepared-artifact:
        description: Same-run Linux workspace archive from the preparation job
        required: false
        type: string
        default: ""
    secrets:
      package-token:
        description: Token used to install packages from GitHub Packages
        required: false

permissions:
  contents: read
  packages: read

jobs:
  check-node-project:
    name: "Check ${{ inputs.package-directory }}"
    runs-on: ubuntu-latest
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v7 # v7
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: ${{ inputs.prepared-artifact == '' && 'npm' || '' }}
          registry-url: https://npm.pkg.github.com
          scope: "@moyarich"
      - name: Download prepared workspace
        if: ${{ inputs.prepared-artifact != '' }}
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.prepared-artifact }}
          path: ${{ runner.temp }}/prepared-workspace
      - name: Restore prepared workspace
        if: ${{ inputs.prepared-artifact != '' }}
        run: tar -xf "$RUNNER_TEMP/prepared-workspace/prepared-workspace.tar"
      - name: Install workspace dependencies
        if: ${{ inputs.prepared-artifact == '' }}
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ secrets.package-token || github.token }}
      - name: Build all local packages
        if: ${{ inputs.prepared-artifact == '' }}
        run: npm run build --if-present

      - name: Test
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then
            npm test
          else
            npm test --workspace "$WORKSPACE"
          fi
      - name: Lint
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run lint --if-present; else npm run lint --workspace "$WORKSPACE" --if-present; fi
      - name: Typecheck
        env:
          WORKSPACE: ${{ inputs.package-directory }}
        run: |
          if [ "$WORKSPACE" = "." ]; then npm run typecheck --if-present; else npm run typecheck --workspace "$WORKSPACE" --if-present; fi

      - name: CI summary
        if: ${{ always() }}
        run: |
          {
            echo "## CI result"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Workspace | \`${{ inputs.package-directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
