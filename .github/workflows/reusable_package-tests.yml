name: -[Reusable] Package Tests

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version used to run package tests
        required: true
        default: "24"
        type: string
      packages-directory:
        description: Directory containing workspace packages
        required: true
        default: packages
        type: string
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to run package tests
        required: false
        type: string
        default: "24"
      packages-directory:
        description: Directory containing workspace packages
        required: false
        type: string
        default: "packages"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js for TypeScript discovery
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - id: packages
        name: Discover packages with tests
        shell: bash
        run: |
          PACKAGES="$(node packages/workspace-tools/src/discover-test-packages.mts "${{ inputs.packages-directory }}" --json)"
          echo "$PACKAGES" | jq -e 'type == "array"' >/dev/null
          MATRIX="$(jq -cn --argjson packages "$PACKAGES" '{include: $packages}')"
          echo "$MATRIX" | jq -e 'type == "object" and (.include | type == "array")' >/dev/null
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          {
            echo "## Package test discovery"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Packages directory | \`${{ inputs.packages-directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo
            echo "### Discovered packages"
            echo
            echo '~~~json'
            echo "$PACKAGES" | jq .
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: discover
    if: needs.discover.outputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm install --ignore-scripts
      - name: Run package tests
        run: npm test --workspace "${{ matrix.name }}"

      - name: Package test summary
        if: ${{ always() }}
        run: |
          {
            echo "## Package tests"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Directory | \`${{ matrix.directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
