name: -[Reusable] Package Tests

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version used to run package tests
        required: true
        default: "22"
        type: string
      packages-directory:
        description: Directory containing workspace packages
        required: true
        default: packages
        type: string
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to run package tests
        required: false
        type: string
        default: "22"
      packages-directory:
        description: Directory containing workspace packages
        required: false
        type: string
        default: "packages"

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.packages.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install discovery dependencies
        run: npm ci --ignore-scripts
      - id: packages
        name: Discover packages with tests
        shell: bash
        run: |
          PACKAGES="$(node scripts/discover-test-packages.mjs "${{ inputs.packages-directory }}")"
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"

          {
            echo "## Package test discovery"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Packages directory | \`${{ inputs.packages-directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo
            echo "### Discovered packages"
            echo
            echo '~~~json'
            echo "$PACKAGES" | jq .
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    needs: discover
    if: needs.discover.outputs.packages != '[]'
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.discover.outputs.packages) }}
    name: Test ${{ matrix.package.name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - run: npm install --ignore-scripts
      - name: Run package tests
        run: npm test --workspace "${{ matrix.package.name }}"

      - name: Package test summary
        if: ${{ always() }}
        run: |
          {
            echo "## Package tests"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.package.name }}\` |"
            echo "| Directory | \`${{ matrix.package.directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
