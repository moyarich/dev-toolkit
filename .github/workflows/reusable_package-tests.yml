name: "Reusable · Package Tests"

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version used to run package tests
        required: true
        default: "24"
        type: string
      packages-directory:
        description: Directory containing workspace packages
        required: true
        default: packages
        type: string
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used to run package tests
        required: false
        type: string
        default: "24"
      packages-directory:
        description: Directory containing workspace packages
        required: false
        type: string
        default: "packages"

jobs:
  discover-packages:
    name: "Discover packages"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.packages.outputs.matrix }}
      has-packages: ${{ steps.packages.outputs.has-packages }}
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Reusable · Package Tests — Discover packages"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Workflow | \`Reusable · Package Tests\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - name: Set up Node.js for TypeScript discovery
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Resolve workspace tools CLI
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ -f packages/workspace-tools/package.json ]; then
            npm run build --workspace @moyarich/workspace-tools
            TOOL_BIN_DIR="$RUNNER_TEMP/workspace-tools-bin"
            rm -rf "$TOOL_BIN_DIR"
            mkdir -p "$TOOL_BIN_DIR"
            npm install               --prefix "$TOOL_BIN_DIR"               --package-lock=false               --ignore-scripts               "$GITHUB_WORKSPACE/packages/workspace-tools"
            echo "WORKSPACE_TOOLS_BIN=$TOOL_BIN_DIR/node_modules/.bin" >> "$GITHUB_ENV"
          else
            TOOL_ROOT="$RUNNER_TEMP/workspace-tools"
            rm -rf "$TOOL_ROOT"
            mkdir -p "$TOOL_ROOT"
            npm install \
              --prefix "$TOOL_ROOT" \
              --package-lock=false \
              --ignore-scripts \
              --registry=https://npm.pkg.github.com \
              @moyarich/workspace-tools
            echo "WORKSPACE_TOOLS_BIN=$TOOL_ROOT/node_modules/.bin" >> "$GITHUB_ENV"
          fi

      - id: packages
        name: Discover packages with tests
        shell: bash
        run: |
          PACKAGES="$("$WORKSPACE_TOOLS_BIN/discover-test-packages" "${{ inputs.packages-directory }}" --json)"
          echo "$PACKAGES" | jq -e 'type == "array"' >/dev/null
          MATRIX="$(jq -cn --argjson packages "$PACKAGES" '{include: $packages}')"
          echo "$MATRIX" | jq -e 'type == "object" and (.include | type == "array")' >/dev/null
          PACKAGE_COUNT="$(echo "$PACKAGES" | jq 'length')"

          {
            echo "matrix=$MATRIX"
            if [ "$PACKAGE_COUNT" -gt 0 ]; then
              echo "has-packages=true"
            else
              echo "has-packages=false"
            fi
          } >> "$GITHUB_OUTPUT"

          {
            echo "## Package test discovery"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Packages directory | \`${{ inputs.packages-directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Package count | **$PACKAGE_COUNT** |"
            echo
            echo "### Discovered packages"
            echo
            echo '~~~json'
            echo "$PACKAGES" | jq .
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

  test-packages:
    needs: discover-packages
    env:
      FORCE_COLOR: "1"
    if: ${{ needs.discover-packages.result == 'success' && needs.discover-packages.outputs.has-packages == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-packages.outputs.matrix || '{"include":[]}') }}
    name: Test ${{ matrix.name }}
    runs-on: ubuntu-latest
    steps:
      - name: Initialize workflow summary
        if: ${{ always() }}
        shell: bash
        run: |
          {
            echo "# Reusable · Package Tests — Test package"
            echo
            echo "| Execution | Value |"
            echo "| --- | --- |"
            echo "| Workflow | \`Reusable · Package Tests\` |"
            echo "| Job | \`${{ github.job }}\` |"
            echo "| Repository | \`${{ github.repository }}\` |"
            echo "| Ref | \`${{ github.ref_name }}\` |"
            echo "| Run | \`#${{ github.run_number }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build package
        run: npm run build --if-present --workspace "${{ matrix.name }}"

      - name: Run package tests
        run: npm test --workspace "${{ matrix.name }}"

      - name: Package test summary
        if: ${{ always() }}
        run: |
          {
            echo "## Package tests"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ matrix.name }}\` |"
            echo "| Directory | \`${{ matrix.directory }}\` |"
            echo "| Node.js | \`${{ inputs.node-version }}\` |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
