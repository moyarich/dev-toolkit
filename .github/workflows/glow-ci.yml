name: "Glow CI"

on:
  workflow_dispatch:
    inputs:
      node-version:
        description: Node.js version used by CI
        required: true
        default: "24"
        type: string
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by CI
        required: false
        default: "24"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  auto-glow:
    name: "Auto Glow integration"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # v7
      - uses: actions/setup-node@v7 # v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://npm.pkg.github.com
      - name: Install workspace dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
      - name: Install Zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh
      # Glow v3 requires this Go toolchain. Keep it out of generic Node CI.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.5"
      - name: Install Glow
        run: go install charm.land/glow/v3@v3.0.0
      - name: Build Auto Glow
        run: npm run build --workspace @moyarich/auto-glow-md --if-present
      # Never fall back on failure: a real-Glow integration failure must fail CI.
      - name: Test Auto Glow
        run: npm run test:ci --workspace @moyarich/auto-glow-md
      - name: Lint
        run: npm run lint --workspace @moyarich/auto-glow-md --if-present
      - name: Typecheck
        run: npm run typecheck --workspace @moyarich/auto-glow-md --if-present
      - name: Validate package tarball
        run: npm pack --workspace @moyarich/auto-glow-md --dry-run
      - name: CI summary
        if: ${{ always() }}
        run: |
          {
            echo "## Auto Glow CI"
            echo
            echo "| Setting | Value |"
            echo "| --- | --- |"
            echo "| Workspace | @moyarich/auto-glow-md |"
            echo "| Glow | v3.0.0 |"
            echo "| Go | 1.26.5 |"
            echo "| Result | **${{ job.status }}** |"
          } >> "$GITHUB_STEP_SUMMARY"
