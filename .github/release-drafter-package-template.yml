name-template: "{{PACKAGE_NAME}} v$RESOLVED_VERSION"
tag-template: "{{PACKAGE_DIRECTORY}}@$RESOLVED_VERSION"
tag-prefix: "{{PACKAGE_DIRECTORY}}@"

include-paths:
  - "{{PACKAGE_DIRECTORY}}/**"

categories:
  - title: "Features"
    labels:
      - enhancement
      - feature

  - title: "Bug fixes"
    labels:
      - bug
      - fix

  - title: "Documentation"
    labels:
      - documentation
      - docs

  - title: "Dependencies"
    labels:
      - dependencies

  - title: "Maintenance"
    labels:
      - chore
      - maintenance
      - ci

exclude-labels:
  - skip-changelog

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - enhancement
      - feature
  patch:
    labels:
      - bug
      - fix
      - dependencies
      - documentation
      - docs
      - chore
      - maintenance
      - ci
  default: patch

template: |
  ## Release notes

  $CHANGES

  ## Install

  ```sh
  npm install {{PACKAGE_NAME}}@$RESOLVED_VERSION --registry=https://npm.pkg.github.com
  ```
