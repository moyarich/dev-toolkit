name-template: "@moyarich/vite-plugin-package-bin v$RESOLVED_VERSION"
tag-template: "packages/vite-plugin-package-bin@$RESOLVED_VERSION"
tag-prefix: "packages/vite-plugin-package-bin@"

include-paths:
  - "packages/vite-plugin-package-bin/**"

categories:
  - title: "Features"
    labels:
      - enhancement
      - feature

  - title: "Bug fixes"
    labels:
      - bug
      - fix

  - title: "Documentation"
    labels:
      - documentation
      - docs

  - title: "Dependencies"
    labels:
      - dependencies

  - title: "Maintenance"
    labels:
      - chore
      - maintenance
      - ci

exclude-labels:
  - skip-changelog

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

version-resolver:
  major:
    labels:
      - breaking
  minor:
    labels:
      - enhancement
      - feature
  patch:
    labels:
      - bug
      - fix
      - dependencies
      - documentation
      - docs
      - chore
      - maintenance
      - ci
  default: patch

template: |
  ## What's Changed

  $CHANGES
