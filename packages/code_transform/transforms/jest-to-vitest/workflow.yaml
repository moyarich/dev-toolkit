version: "1"

nodes:
  - id: extend-jest-to-vitest
    name: Extend Jest to Vitest migration
    type: automatic
    steps:
      - name: Convert remaining Jest APIs and TypeScript Jest types
        js-ast-grep:
          js_file: "scripts/extend-jest-to-vitest.ts"
          language: "typescript"
          include:
            - "**/*.ts"
            - "**/*.tsx"

      - name: Validate no Jest namespace references remain
        run: |
          if grep -R --line-number --include='*.ts' --include='*.tsx' '\bjest\.' .; then
            echo "Jest namespace references remain after the migration."
            exit 1
          fi
